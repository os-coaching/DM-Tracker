<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DM Tracker">
<meta name="theme-color" content="#0F1115">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230057FF'/><path d='M8 21V11h5.2c3 0 4.9 2 4.9 5s-1.9 5-4.9 5H8Zm3-2.4h2c1.4 0 2.2-1 2.2-2.6s-.8-2.6-2.2-2.6h-2v5.2Z' fill='white'/><circle cx='23' cy='19.5' r='2' fill='white'/></svg>">
<title>DM Outreach Tracker</title>
<style>
:root{
  color-scheme:dark;
  --accent:#0057FF;        /* brand blue, fills: white on it = 5.5:1 */
  --accent-text:#7AA8FF;   /* accent as text on dark = 7.4:1 */
  --accent-soft:rgba(0,87,255,.20);
  --accent-ring:rgba(0,87,255,.38);
  --red:#FF6B5E;
  --red-soft:rgba(255,107,94,.13);
  --red-line:rgba(255,107,94,.4);
  --text:#E9ECF2;
  --muted:#8B94A4;
  --faint:#757F90;
  --bg:#0F1115;
  --surface:#171A21;
  --surface-2:#1E222B;
  --line:#262B35;
  --line-soft:#1D212A;
  --radius:10px;
  /* chart palette, validated with the dataviz validator against surface #171A21.
     Blue ramp + red ramp both pass all ordinal checks; grey clears 3.43:1. */
  --b1:#1B4BB8; --b2:#2F6DFF; --b3:#5D95FF; --b4:#9BC0FF;
  --r1:#9E271E; --r2:#C2382C; --r3:#F0574A; --r4:#FF9187;
  --dim:#656F7F;
  --track:#20252F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:64px;
}
::selection{background:var(--accent-ring);color:#fff}
.wrap{max-width:880px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;
  background:rgba(15,17,21,.86);
  -webkit-backdrop-filter:saturate(1.6) blur(14px);
  backdrop-filter:saturate(1.6) blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:10px;padding:15px 0 12px}
.brand h1{font-size:15px;font-weight:640;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--faint)}

/* stats strip */
.stats{display:flex;gap:8px;padding-bottom:14px}
.stat{
  flex:1 1 0;min-width:0;background:var(--surface);border-radius:var(--radius);
  padding:9px 12px;
}
.stat .k{
  font-size:10px;line-height:1.3;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);
  min-height:26px;
}
.stat .v{font-size:20px;font-weight:650;letter-spacing:-.02em;margin-top:3px}
.stat .v em{font-style:normal;color:var(--faint);font-weight:500;font-size:13px}

/* tabs */
nav{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  appearance:none;background:none;border:none;border-bottom:2px solid transparent;
  font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer;
  padding:9px 12px;white-space:nowrap;transition:color .12s;
}
nav button .n{
  font-size:11px;color:var(--faint);background:var(--surface-2);
  border-radius:20px;padding:1px 6px;margin-left:6px;
}
nav button:hover{color:var(--text)}
nav button .short{display:none}
nav button.on{color:#fff;border-bottom-color:var(--accent);font-weight:600}
nav button.on .n{background:var(--accent-soft);color:var(--accent-text)}

/* quick add */
.quick{display:flex;gap:8px;padding:12px 0 12px}
.quick input{
  flex:1;min-width:0;font:inherit;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--surface);color:var(--text);transition:border-color .12s,box-shadow .12s;
}
.quick input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.quick input::placeholder{color:var(--faint)}

/* search */
.search{display:none;gap:8px;align-items:center;padding:0 0 12px}
.search.on{display:flex}
.search input{
  flex:1;min-width:0;font:inherit;font-size:14px;color:var(--text);
  padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 16 16'><circle cx='7' cy='7' r='4.6' fill='none' stroke='%23757F90' stroke-width='1.7'/><path d='M10.6 10.6L14 14' stroke='%23757F90' stroke-width='1.7' stroke-linecap='round'/></svg>") no-repeat left 11px center;
  transition:border-color .12s,box-shadow .12s;
}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.search input::placeholder{color:var(--faint)}
.search .scount{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.search .scount.none{color:var(--red)}
.search #sClear{display:none}
.search.active #sClear{display:inline-block}
mark{background:var(--accent-soft);color:var(--accent-text);border-radius:3px;padding:0 1px}
.row.due mark{background:rgba(255,107,94,.22);color:#FFB3AB}
.xtab{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:16px 2px 0;font-size:12.5px;color:var(--faint);
}

/* buttons */
button.btn{
  appearance:none;font:inherit;font-size:13px;cursor:pointer;border-radius:var(--radius);
  padding:10px 16px;border:none;background:var(--accent);color:#fff;font-weight:600;
  white-space:nowrap;transition:filter .12s;
}
button.btn:hover{filter:brightness(1.12)}
button.mini{
  appearance:none;font:inherit;font-size:12px;cursor:pointer;border-radius:7px;
  padding:6px 10px;border:1px solid transparent;background:var(--surface-2);color:var(--muted);
  white-space:nowrap;transition:background .12s,color .12s;
}
button.mini:hover{background:#282E3A;color:var(--text)}
button.mini.primary{background:var(--accent);color:#fff;font-weight:600}
button.mini.primary:hover{background:var(--accent);filter:brightness(1.12)}
button.mini.danger{color:var(--muted);background:transparent;border-color:var(--line)}
button.mini.danger:hover{background:var(--red-soft);color:var(--red);border-color:var(--red-line)}
/* progression action: the only lit button on a waiting row */
button.mini.go{
  background:var(--accent);border-color:var(--accent);color:#fff;
  font-weight:650;font-size:13px;padding:8px 16px;
}
button.mini.go:hover{background:var(--accent);filter:brightness(1.14)}
/* chase actions: red, deliberately not lit, this is not progress */
button.mini.chase{background:transparent;border-color:var(--red-line);color:var(--red)}
button.mini.chase:hover{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.row.due button.mini.chase{background:rgba(0,0,0,.26);border-color:var(--red)}
.row.due button.mini.chase:hover{background:rgba(0,0,0,.4)}
button.x{
  appearance:none;border:none;background:none;font:inherit;font-size:16px;line-height:1;
  color:var(--faint);cursor:pointer;padding:5px 7px;border-radius:6px;transition:color .12s,background .12s;
}
button.x:hover{color:var(--red);background:var(--red-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}

/* flash */
.flash{
  display:none;margin:14px 0 4px;padding:10px 13px;border-radius:var(--radius);
  font-size:13px;background:var(--red-soft);color:var(--red);border:1px solid var(--red-line);
}
.flash.show{display:block}
.flash.ok{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent-ring)}

/* sections */
section{padding:14px 0 4px;display:flex;flex-direction:column;gap:6px}
.sechead{
  display:flex;align-items:center;gap:10px;margin:26px 0 2px;
  font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;
}
.sechead .line{flex:1;height:1px;background:var(--line)}
.sechead.click{cursor:pointer;user-select:none}
.sechead.click:hover{color:var(--text)}
.sechead .cnt{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
.sechead.alert{color:var(--red)}

/* rows */
.row{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 14px;background:var(--surface);border-radius:var(--radius);
  border-left:2px solid transparent;transition:background .12s;
}
.row:hover{background:var(--surface-2)}
.row.due{
  background:var(--red-soft);border-left-color:var(--red);
}
.row.due:hover{background:rgba(255,107,94,.18)}
.rowmain{display:flex;align-items:baseline;gap:11px;flex:1 1 240px;min-width:0;flex-wrap:wrap}
.handle{font-weight:600;font-size:14.5px;letter-spacing:-.01em;word-break:break-all}
.cd{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cd.due{color:var(--red);font-weight:650;letter-spacing:.03em}
.cd.final{color:var(--faint);font-style:italic}
.acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta{font-size:12px;color:var(--faint);white-space:nowrap}
.row.due .meta{color:rgba(255,150,140,.72)}
/* ---------- follow-up board (Leads tab) ---------- */
/* minmax(0,1fr), not 1fr: long overdue pills otherwise stretch one column and squeeze the rest */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
.bhead{background:var(--surface);border-radius:var(--radius);padding:11px 13px;margin-bottom:8px}
.bhead .bt{display:flex;align-items:center;gap:8px}
.bhead h3{font-size:13px;font-weight:650;letter-spacing:-.01em;flex:1}
.bhead .bn{
  font-size:11px;color:var(--faint);background:var(--surface-2);
  border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums;
}
.bhead.hot .bn{background:var(--red-soft);color:var(--red);font-weight:600}
.bhead .brule{font-size:11.5px;color:var(--faint);margin-top:3px}
.bcards{display:flex;flex-direction:column;gap:7px}
.lcard{
  background:var(--surface);border-radius:var(--radius);padding:11px 12px;
  border-left:2px solid transparent;transition:background .12s;
}
.lcard:hover{background:var(--surface-2)}
.lcard.due{background:var(--red-soft);border-left-color:var(--red)}
.lcard.due:hover{background:rgba(255,107,94,.18)}
.ltop{display:flex;align-items:center;gap:9px}
.ltop .handle{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ltop .pill{flex:0 0 auto}
.lmeta{font-size:11.5px;color:var(--faint);margin-top:5px}
.lcard.due .lmeta{color:rgba(255,150,140,.7)}
.lcard .acts{margin-top:9px}
.pill{
  font-size:11px;padding:3px 9px;border-radius:20px;background:var(--surface-2);
  color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;
  border:1px solid transparent;
}
.pill.due{background:rgba(0,0,0,.24);color:var(--red);font-weight:650;border-color:var(--red-line)}
.pill.final{background:var(--surface-2);color:var(--faint);font-style:italic}
.bempty{font-size:12px;color:var(--faint);padding:14px 4px;text-align:center}

/* progress meter: one pip per checkpoint up to Call Booked */
.prog{flex:1 1 100%;display:flex;align-items:center;gap:10px;margin-top:3px}
.pips{display:flex;gap:3px;flex:0 1 210px;min-width:90px}
.pips i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--accent-text)}
.prog .pct{font-size:11.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.prog.full .pct{color:var(--accent-text);font-weight:600}
.row.due .pips i{background:rgba(255,255,255,.13)}
.row.due .pips i.on{background:#9CBEFF}

/* inline notes preview, truncates to whatever width is left */
.npv{
  flex:1 1 0;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:12.5px;color:var(--muted);cursor:pointer;
  border-left:2px solid var(--line);padding-left:9px;transition:color .12s;
}
.npv:hover{color:var(--text)}
.row.due .npv{border-left-color:var(--red-line)}
select.stage{
  font:inherit;font-size:13px;padding:6px 26px 6px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--surface-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23959EAC' stroke-width='1.5'/></svg>") no-repeat right 9px center;
  appearance:none;color:var(--text);cursor:pointer;
}
select.stage:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
select.stage.gold{border-color:var(--accent);color:var(--accent-text);font-weight:600}
select.stage option{background:var(--surface-2);color:var(--text)}
.notes{flex:1 1 100%;margin:2px 0 0}
.notes textarea{
  width:100%;font:inherit;font-size:13.5px;line-height:1.55;padding:11px 13px;
  border:1px solid var(--line);border-radius:8px;resize:vertical;min-height:78px;
  color:var(--text);background:var(--bg);
}
.notes textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.notes textarea::placeholder{color:var(--faint)}

.empty{color:var(--faint);font-size:13.5px;padding:44px 0;text-align:center}

/* ---------- statistics ---------- */
.srow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 0 4px}
.srow .sp{flex:1}
.seg{display:flex;gap:2px;background:var(--surface);border-radius:8px;padding:2px}
.seg button{
  appearance:none;border:none;background:none;font:inherit;font-size:12px;color:var(--muted);
  padding:5px 11px;border-radius:6px;cursor:pointer;
}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}

.card{background:var(--surface);border-radius:var(--radius);padding:15px 17px;margin-bottom:10px}
.card h4{
  font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
  font-weight:600;margin-bottom:2px;
}
.card .csub{font-size:12px;color:var(--faint);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* hero + kpi tiles */
.tile .big{font-size:27px;font-weight:660;letter-spacing:-.025em;margin-top:4px}
.tile .sub{font-size:12px;color:var(--faint);margin-top:3px}
.tile .sub b{color:var(--muted);font-weight:600}

/* meters (single ratio against a limit) */
.meter{margin-top:13px}
.meter:first-of-type{margin-top:4px}
.meter .top{display:flex;align-items:baseline;gap:8px;font-size:13px;margin-bottom:6px}
.meter .top .lbl{flex:1;color:var(--muted)}
.meter .top .val{font-weight:650;font-variant-numeric:tabular-nums}
.meter .top .val i{font-style:normal;color:var(--faint);font-weight:500}
.mtrack{height:7px;background:var(--track);border-radius:4px;overflow:hidden}
.mfill{height:100%;background:var(--b2);border-radius:0 4px 4px 0}
.mfill.done{background:var(--b3)}
.mfill.zero{background:var(--dim)}

/* funnel: horizontal bars, sequential ramp */
.fn{display:flex;flex-direction:column;gap:9px}
.fnrow{display:grid;grid-template-columns:118px 1fr auto;align-items:center;gap:11px}
.fnrow .fl{font-size:12.5px;color:var(--muted)}
.ftrack{height:20px;background:var(--track);border-radius:3px;position:relative}
.ffill{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.fnrow .fv{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.fnrow .fv span{font-weight:500;color:var(--faint);font-size:11.5px}

/* columns */
.cols{display:flex;align-items:stretch;gap:5px;height:126px;padding-top:6px}
.cols .col{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
/* the bar scales against this box only, so it is never flex-shrunk out of proportion */
.cols .cplot{flex:1;min-height:0;display:flex;align-items:flex-end}
.cols .cbar{
  border-radius:4px 4px 0 0;background:var(--b2);min-height:2px;
  width:100%;max-width:24px;margin:0 auto;   /* cap thickness, let the band keep its air */
}
.cols .clab{
  flex:0 0 auto;font-size:10px;color:var(--faint);text-align:center;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.cols .cval{flex:0 0 auto;font-size:10.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;min-height:14px}

/* donuts */
.dnwrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dnwrap svg{flex:0 0 auto}
.leg{flex:1;min-width:150px;display:flex;flex-direction:column;gap:6px}
.leg .li{display:flex;align-items:center;gap:8px;font-size:12.5px}
.leg .sw{width:9px;height:9px;border-radius:2px;flex:0 0 auto}
.leg .ln{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leg .lv{font-variant-numeric:tabular-nums;font-weight:600}
.leg .lp{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums;min-width:34px;text-align:right}

/* line chart */
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto}
.gridline{stroke:var(--line);stroke-width:1}
.axlab{fill:var(--faint);font-size:10px}
.hit{fill:transparent;cursor:crosshair}
.hit:hover{fill:rgba(255,255,255,.04)}
.legrow{display:flex;gap:14px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.legrow .li{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.legrow .sw{width:14px;height:3px;border-radius:2px}

/* attention chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.chip{
  appearance:none;font:inherit;font-size:12px;cursor:pointer;
  background:var(--surface-2);color:var(--muted);border:1px solid transparent;
  border-radius:20px;padding:5px 12px;
}
.chip:hover{color:var(--text);background:#282E3A}
.chip.hot{background:var(--red-soft);border-color:var(--red-line);color:var(--red);font-weight:600}
.chip.hot:hover{background:rgba(255,107,94,.2)}
.allclear{font-size:13px;color:var(--muted);padding:2px 0}

/* data table */
details.dt{margin:6px 0 0}
details.dt summary{
  font-size:12px;color:var(--faint);cursor:pointer;padding:8px 0;list-style:none;
}
details.dt summary::-webkit-details-marker{display:none}
details.dt summary:hover{color:var(--text)}
details.dt table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
details.dt th,details.dt td{
  text-align:left;padding:6px 9px;border-bottom:1px solid var(--line-soft);
  font-variant-numeric:tabular-nums;
}
details.dt th{color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
details.dt td{color:var(--muted)}
.tscroll{overflow-x:auto}

/* tooltip */
#tip{
  position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s;
  background:#0A0C10;border:1px solid var(--line);border-radius:7px;
  padding:7px 10px;font-size:12px;color:var(--text);white-space:pre-line;
  box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:230px;
}
#tip.on{opacity:1}

/* saved prompt block on the script tab */
.pbox{background:var(--surface);border-radius:var(--radius);padding:13px 15px;margin-bottom:10px}
.pbox summary{
  font-size:13px;font-weight:650;cursor:pointer;list-style:none;color:var(--text);
  letter-spacing:-.01em;
}
.pbox summary::-webkit-details-marker{display:none}
.pbox summary:before{content:"\25B8  ";color:var(--faint)}
.pbox[open] summary:before{content:"\25BE  "}
.pbox summary:hover{color:var(--accent-text)}
.pbar{display:flex;align-items:center;gap:10px;margin:12px 0 9px;flex-wrap:wrap}
.phint{flex:1 1 160px;font-size:12px;color:var(--faint);min-width:0}
.ptext{
  background:var(--bg);border-radius:8px;padding:12px 13px;
  font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--muted);white-space:pre-wrap;word-break:break-word;
  max-height:360px;overflow:auto;
}

/* script tab */
.stage{background:var(--surface);border-radius:var(--radius);padding:15px 17px;margin-bottom:10px}

<!-- Saved prompt text. Held as text/plain so nothing inside it needs JS escaping. -->
<script type="text/plain" id="aiPromptSrc">
Open index.html, my existing DM outreach tracker. Add an AI reply-drafting feature. Everything is ADDITIVE: do not break or change any existing flow, tab, countdown, or the localStorage data model. Keep it one self-contained file, vanilla HTML/CSS/JS, no frameworks, no build step. Match the existing design exactly (white, dark text, #0057FF accent, clean and minimal).

WHAT IT DOES
In the "Leads That Respond" tab, every lead row gets a "Draft" button. Clicking it opens a panel for that lead showing: their handle, their current stage (pre-filled from their dropdown), their notes (editable in place, saves to the same notes field), and a textarea labelled "their latest reply". A Generate button calls the Anthropic API and returns reply drafts in my voice, specific to their message and stage.

API PLUMBING
- Settings gear in the footer: field for Anthropic API key, field for model (default "claude-sonnet-4-6"), a test button that makes a tiny API call and shows pass/fail. Store both ONLY in localStorage. Never hardcode the key anywhere in the file.
- Call POST https://api.anthropic.com/v1/messages with headers: x-api-key, anthropic-version: 2023-06-01, content-type: application/json, and anthropic-dangerous-direct-browser-access: true (required for browser calls, do not omit).
- max_tokens 1000. Instruct the model to return ONLY raw JSON. On response, strip any ``` fences before JSON.parse. Wrap in try/catch. Show clear inline errors for: missing key, invalid key (401), rate limit (429), network offline. Errors must never crash the page.

THE SYSTEM PROMPT (send this as the system parameter on every call, verbatim)
---
You draft Instagram DM replies AS Ollie, a UK online fitness coach. You write exactly in his voice.

VOICE, HARD RULES: short choppy messages, casual lowercase-leaning, words like mate, ye, abit, haha. One thought per message. Messages usually under 15 words. Only ONE question per turn and it is always the final message. Never polished multi-clause sentences. Never em dashes. Never the phrases "most lads" or "most people". No corporate words, no emojis, no exclamation spam. Takeaway or park messages may end with no question.

PROOF BANK, THE ONLY CLIENTS THAT EXIST: Harry, army lad, +8lbs in 6 weeks on active service. Leo, uni student, -7kg in 8 weeks. Finn, uni student, +4lbs in 4 weeks. Never invent other clients, results, or numbers.

THE SCRIPT, CHECKPOINT ORDER IS FIXED: Open > Control Q ("you following for the vids or actually looking to get in shape?") > Goal ("what you training towards?", dig once if surface: "what would that actually look like for you?") > Pain 1 ("whats getting in the way at the minute?") > Pain 2 ("what you tried before?") > Mirror (repeat their situation back in their own words, then "that right?") > Golden Q ("do you want me to help you sort it?") > Tie Downs (send proof as a statement then "reckon you could do the same?", "have you worked with a coach before?", "commitment 1-10?" and if 7 or under "what would make it a 9?") > Call (two concrete time slots, never open-ended).

STAGE GATES: Mirror is forbidden until goal, struggle, and what they have tried are all known from their words. Golden Q is forbidden until a mirror was confirmed. The mirror draft must be built ONLY from details they actually said, in the notes or the pasted reply. If details are missing, the correct draft is the missing question, not an invented mirror.

BRANCHES: vids-only or standoffish reply: advise leaving it, draft one light no-question close. Golden Q no: dig once "whats holding you back?", handle a real objection, otherwise clean takeaway "no stress mate, sounds like nows not the time, i'll check back in a few weeks", never guilt. No pain found after digging: park warm, do not invent pain. Local lead (trains at NRG or nearby): call stage becomes meeting at the gym instead of a phone call.

INPUT YOU RECEIVE: their handle, the stage Ollie selected, accumulated notes, their latest reply.

OUTPUT: raw JSON only, no fences, no preamble, exactly this shape:
{"stage_check":{"selected":"...","correct":"...","reason":"one blunt line"},"drafts":[{"label":"one word angle","messages":["msg1","msg2"]}],"next_checkpoint":"one line on what comes after this send"}
Rules: 2 or 3 drafts. Each draft is 1 to 3 messages. If Ollie picked the wrong stage, correct it in stage_check and draft for the CORRECT stage.
---

USER MESSAGE PER CALL: JSON of {handle, selected_stage, notes, latest_reply}.

RENDERING THE RESULT
- Stage check line at the top: green tick if confirmed. If corrected, amber with the reason and a one-click "update stage" button that sets the lead's stage dropdown to the corrected stage.
- Each draft as a labelled group of message bubbles. Copy button on every individual bubble (his style is separate messages) plus a copy-all per draft.
- next_checkpoint as one small grey line at the bottom.
- "Log exchange" button: appends to the lead's notes a timestamped block, "them: [latest reply]" and "me: [whichever draft he copied last]", so context builds for future drafts.
- Loading state on Generate, button disabled while a call is in flight.

QUALITY BAR
Before finishing, test: draft flow end to end with a fake key (clean error), settings save/reload, stage correction path updates the dropdown, log exchange appends correctly, all copy buttons, mobile layout, and confirm every pre-existing tracker feature still works: add lead, countdowns, follow-up buttons, replied path, park, resurface, archive, revive, stats strip, export, import. No console errors.
</script>

<script>
(function(){
"use strict";

/* ---------------- constants ---------------- */
var KEY = "dm_tracker_v1";
var STAGES = ["Control Q","Goal","Pain","Mirror","Golden Q","Tie Downs","Call Booked","Client"];
var GOLDEN_IDX = 4;
var CALL_IDX = 6;
var DAY = 86400000;
var FOLLOWUP_AFTER = 3 * DAY;
var MEME_AFTER = 7 * DAY;
var CHASE1_AFTER = 1 * DAY;
var CHASE2_AFTER = 3 * DAY;
var PARK_FOR = 21 * DAY;
var WEEKLY_TARGET = 25;
var DAILY_TARGET = Math.round(WEEKLY_TARGET / 5);   // 25 a week over 5 working days
var GOLDEN_DAILY_TARGET = 1;
var TABS = [
  {id:"stats",  label:"Statistics",         short:"Stats"},
  {id:"leads",  label:"Leads",              short:"Leads"},
  {id:"respond",label:"Leads That Respond", short:"Respond"},
  {id:"dead",   label:"Leads That Don't",   short:"Don't"},
  {id:"script", label:"Script",             short:"Script"}
];

/* ---------------- state ---------------- */
var state = load();
var ui = { tab:"leads", notesOpen:{}, parkedOpen:false, clientsOpen:true, q:"", range:30 };
var lastOverdueSig = "";

function load(){
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  var s = null;
  if (raw){ try { s = JSON.parse(raw); } catch(e){ s = null; } }
  if (!s || typeof s !== "object") s = {};
  if (!Array.isArray(s.leads)) s.leads = [];
  if (!s.scriptChecks || typeof s.scriptChecks !== "object") s.scriptChecks = {};
  s.leads = s.leads.filter(function(l){ return l && typeof l.handle === "string"; }).map(normalise);
  return s;
}
function normalise(l){
  return {
    id: l.id || uid(),
    handle: String(l.handle || "").toLowerCase().replace(/^@+/,"").trim(),
    firstDmAt: num(l.firstDmAt, Date.now()),
    followUp1SentAt: num(l.followUp1SentAt, null),
    memeSentAt: num(l.memeSentAt, null),
    repliedAt: num(l.repliedAt, null),
    lastReplyAt: num(l.lastReplyAt, num(l.repliedAt, num(l.createdAt, num(l.firstDmAt, Date.now())))),
    status: ["waiting","responded","no_response","parked","client"].indexOf(l.status) > -1 ? l.status : "waiting",
    stage: STAGES.indexOf(l.stage) > -1 ? l.stage : null,
    goldenQAt: num(l.goldenQAt, null),
    notes: typeof l.notes === "string" ? l.notes : "",
    parkedUntil: num(l.parkedUntil, null),
    archivedAt: num(l.archivedAt, null),
    createdAt: num(l.createdAt, num(l.firstDmAt, Date.now()))
  };
}
function num(v, d){ return (typeof v === "number" && isFinite(v)) ? v : d; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ flash("Could not save to localStorage: " + e.message, false); }
}

/* ---------------- helpers ---------------- */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
/* search: normalise a typed query the same way handles are stored */
function normQ(v){ return String(v || "").trim().replace(/^@+/,"").replace(/\s+/g,"").toLowerCase(); }
/* -1 no match, 0 starts-with (ranked first), 1 contains */
function matchRank(handle, q){
  if (!q) return 0;
  var i = handle.indexOf(q);
  if (i < 0) return -1;
  return i === 0 ? 0 : 1;
}
function filterList(list, q){
  if (!q) return list;
  return list.filter(function(l){ return matchRank(l.handle, q) > -1; })
             .sort(function(a,b){ return matchRank(a.handle, q) - matchRank(b.handle, q); });
}
/* progress toward offering the call: Control Q .. Call Booked = 7 checkpoints */
function progressOf(l){
  var idx = STAGES.indexOf(l.stage);
  if (idx < 0) idx = 0;
  var total = CALL_IDX + 1;
  var done = Math.min(idx, CALL_IDX) + 1;
  return { done: done, total: total, pct: Math.round(done / total * 100) };
}
function progressBar(l){
  var p = progressOf(l);
  var pips = "";
  for (var i = 0; i < p.total; i++) pips += "<i" + (i < p.done ? ' class="on"' : "") + "></i>";
  return '<div class="prog' + (p.pct === 100 ? " full" : "") + '" title="' + p.done + " of " + p.total +
    ' checkpoints cleared on the way to offering the call">' +
    '<span class="pips">' + pips + "</span>" +
    '<span class="pct">' + (p.pct === 100 ? "call reached" : p.pct + "% to call") + "</span></div>";
}

/* one-line notes preview beside the handle; click opens the full editor */
function notesPreview(l){
  var n = (l.notes || "").replace(/\s+/g, " ").trim();
  if (!n || ui.notesOpen[l.id]) return "";
  return '<span class="npv" data-toggle-notes="' + l.id + '" title="' + esc(n) + '">' + esc(n) + "</span>";
}
/* escaped handle with the matched run wrapped in <mark> */
function hl(handle){
  var q = ui.q;
  if (!q) return esc(handle);
  var i = handle.indexOf(q);
  if (i < 0) return esc(handle);
  return esc(handle.slice(0, i)) + "<mark>" + esc(handle.slice(i, i + q.length)) + "</mark>" + esc(handle.slice(i + q.length));
}
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function plural(n, word, many){ return n + " " + (n === 1 ? word : (many || word + "s")); }
function fmtLeft(ms){
  if (ms < 0) ms = 0;
  var d = Math.floor(ms / DAY);
  var h = Math.floor(ms % DAY / 3600000);
  var m = Math.floor(ms % 3600000 / 60000);
  var s = Math.floor(ms % 60000 / 1000);
  if (d > 0) return d + "d " + h + "h " + pad(m) + "m";
  if (h > 0) return h + "h " + pad(m) + "m";
  return pad(m) + "m " + pad(s) + "s";
}
function fmtDate(ts){
  if (!ts) return "-";
  var d = new Date(ts);
  return d.getDate() + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()] + " " + d.getFullYear();
}
function mondayStart(){
  var d = new Date();
  d.setHours(0,0,0,0);
  var dow = d.getDay();            // 0 Sun .. 6 Sat
  var back = (dow + 6) % 7;        // days since Monday
  return d.getTime() - back * DAY;
}
function byId(id){ return state.leads.filter(function(l){ return l.id === id; })[0]; }
function tabOf(l){
  if (l.status === "waiting") return "leads";
  if (l.status === "no_response") return "dead";
  return "respond";
}
function tabLabel(id){
  for (var i=0;i<TABS.length;i++) if (TABS[i].id === id) return TABS[i].label;
  return id;
}
function stateLabel(l){
  if (l.status === "waiting"){
    if (l.memeSentAt) return "no reply, final";
    if (l.followUp1SentAt) return "follow-up sent";
    return "waiting on reply";
  }
  if (l.status === "no_response") return "archived";
  if (l.status === "parked") return "parked, " + (l.stage || "Control Q");
  if (l.status === "client") return "client";
  return l.stage || "responded";
}

/* countdown model for a waiting lead */
function phaseOf(l){
  if (l.memeSentAt) return { kind:"final", target:null };
  if (l.followUp1SentAt) return { kind:"meme", target: l.firstDmAt + MEME_AFTER };
  return { kind:"followup", target: l.firstDmAt + FOLLOWUP_AFTER };
}
function cdText(l, now){
  var p = phaseOf(l);
  // the board column names the message, so the pill only carries the timing
  if (p.kind === "final") return { text:"no reply, final", due:false, final:true };
  var left = p.target - now;
  if (left <= 0){
    var over = Math.floor(-left / DAY);
    return { text: over >= 1 ? plural(over, "day") + " overdue" : "due now", due:true, final:false };
  }
  return { text: "in " + fmtLeft(left), due:false, final:false };
}
function sortKey(l, now){
  var p = phaseOf(l);
  if (p.kind === "final") return Infinity;
  return p.target - now;
}

/* chase-up model for a lead in conversation (tab 2) */
function chaseAnchor(l){ return l.lastReplyAt || l.repliedAt || l.createdAt || Date.now(); }
function chaseText(l, now){
  var a = chaseAnchor(l);
  if (now < a + CHASE1_AFTER) return { text:"Chase in " + fmtLeft(a + CHASE1_AFTER - now), due:false, level:0 };
  if (now < a + CHASE2_AFTER) return { text:"CHASE · quiet 1d", due:true, level:1 };
  return { text:"CHASE · quiet 3d", due:true, level:2 };
}

/* ---------------- flash ---------------- */
var flashTimer = null;
function flash(msg, ok){
  var el = document.getElementById("flash");
  el.textContent = msg;
  el.className = "flash show" + (ok ? " ok" : "");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(function(){ el.className = "flash"; }, 4500);
}
function clearFlash(){
  clearTimeout(flashTimer);
  document.getElementById("flash").className = "flash";
}

/* ---------------- quick add ---------------- */
function addLead(raw){
  var h = String(raw || "").trim().replace(/^@+/,"").trim().toLowerCase();
  h = h.replace(/\s+/g,"");
  if (!h){ flash("Enter a handle first.", false); return false; }
  var dupe = state.leads.filter(function(l){ return l.handle === h; })[0];
  if (dupe){
    flash("@" + dupe.handle + " already exists in " + tabLabel(tabOf(dupe)) + " at " + stateLabel(dupe), false);
    return false;
  }
  var now = Date.now();
  state.leads.push({
    id: uid(), handle: h, firstDmAt: now, followUp1SentAt:null, memeSentAt:null,
    repliedAt:null, status:"waiting", stage:null, goldenQAt:null, notes:"",
    parkedUntil:null, archivedAt:null, createdAt: now
  });
  save();
  clearFlash();
  if (ui.tab === "script" || ui.tab === "dead") ui.tab = "leads";
  // drop any active filter, otherwise the lead just added could be filtered out of sight
  if (ui.q){ ui.q = ""; var sqEl = document.getElementById("sq"); if (sqEl) sqEl.value = ""; }
  render();
  return true;
}

/* ---------------- actions ---------------- */
function act(id, what){
  var l = byId(id);
  if (!l) return;
  var now = Date.now();
  if (what === "followup"){ l.followUp1SentAt = now; }
  else if (what === "meme"){ l.memeSentAt = now; if (!l.followUp1SentAt) l.followUp1SentAt = now; }
  else if (what === "replied"){
    l.repliedAt = now; l.lastReplyAt = now; l.status = "responded"; l.stage = "Control Q";
    l.parkedUntil = null; l.archivedAt = null;
    ui.tab = "respond";
  }
  else if (what === "recontact"){ l.lastReplyAt = now; }
  else if (what === "archive" || what === "dead"){
    l.status = "no_response"; l.archivedAt = now; l.parkedUntil = null;
  }
  else if (what === "park"){
    l.status = "parked"; l.parkedUntil = now + PARK_FOR; ui.parkedOpen = true;
  }
  else if (what === "unpark"){
    l.status = "responded"; l.parkedUntil = null; l.lastReplyAt = now;
  }
  else if (what === "revive"){
    l.status = "responded"; l.stage = "Control Q"; l.archivedAt = null; l.parkedUntil = null;
    l.lastReplyAt = now;
    if (!l.repliedAt) l.repliedAt = now;
    ui.tab = "respond";
  }
  else if (what === "delete"){
    if (!confirm("Delete @" + l.handle + "? This cannot be undone.")) return;
    state.leads = state.leads.filter(function(x){ return x.id !== id; });
    delete ui.notesOpen[id];
  }
  save();
  render();
}
function setStage(id, stage){
  var l = byId(id);
  if (!l) return;
  var idx = STAGES.indexOf(stage);
  if (idx < 0) return;
  l.stage = stage;
  l.lastReplyAt = Date.now();   // stage moved = live activity, restart the chase clock
  if (idx >= GOLDEN_IDX && !l.goldenQAt) l.goldenQAt = Date.now();
  if (stage === "Client"){ l.status = "client"; l.parkedUntil = null; }
  else if (l.status === "client"){ l.status = "responded"; }
  save();
  render();
}

/* ---------------- stats ---------------- */
function renderStats(){
  var wk = mondayStart();
  var total = state.leads.length;
  var opens = state.leads.filter(function(l){ return l.createdAt >= wk; }).length;
  var golden = state.leads.filter(function(l){ return l.goldenQAt && l.goldenQAt >= wk; }).length;
  var calls = state.leads.filter(function(l){
    return l.stage && STAGES.indexOf(l.stage) >= CALL_IDX;
  }).length;
  var replied = state.leads.filter(function(l){ return l.repliedAt !== null; }).length;
  var rate = total ? Math.round(replied / total * 100) : 0;

  document.getElementById("stats").innerHTML =
    stat("Opens this week", opens + ' <em>/ ' + WEEKLY_TARGET + "</em>") +
    stat("Golden Qs this week", golden) +
    stat("Calls booked", calls) +
    stat("Reply rate", rate + "<em>%</em>");

  document.getElementById("totalHint").textContent =
    plural(total, "lead") + " stored locally in this browser";
}
function stat(k, v){
  return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + "</div></div>";
}

/* ---------------- nav ---------------- */
function counts(){
  var c = {leads:0, respond:0, dead:0};
  state.leads.forEach(function(l){ c[tabOf(l)]++; });
  return c;
}
function renderNav(){
  var c = counts();
  document.getElementById("nav").innerHTML = TABS.map(function(t){
    var n = (t.id === "script" || t.id === "stats") ? "" : '<span class="n">' + c[t.id] + "</span>";
    return '<button data-tab="' + t.id + '" class="' + (ui.tab === t.id ? "on" : "") + '">' +
      '<span class="full">' + esc(t.label) + '</span><span class="short">' + esc(t.short) + "</span>" + n + "</button>";
  }).join("");
}

/* search bar lives in the static header, so typing never loses focus to a re-render */
function renderSearch(){
  var bar = document.getElementById("searchBar");
  var on = ui.tab !== "script" && ui.tab !== "stats";
  bar.className = "search" + (on ? " on" : "") + (ui.q ? " active" : "");
  if (!on) return;
  var hits = state.leads.filter(function(l){ return matchRank(l.handle, ui.q) > -1 && tabOf(l) === ui.tab; }).length;
  var total = state.leads.filter(function(l){ return tabOf(l) === ui.tab; }).length;
  var el = document.getElementById("sCount");
  el.textContent = ui.q ? hits + " of " + total : "";
  el.className = "scount" + (ui.q && !hits ? " none" : "");
}

/* ---------------- views ---------------- */
function render(){
  renderStats();
  renderNav();
  renderSearch();
  var v = document.getElementById("view");
  if (ui.tab === "stats") v.innerHTML = viewStats();
  else if (ui.tab === "leads") v.innerHTML = viewLeads();
  else if (ui.tab === "respond") v.innerHTML = viewRespond();
  else if (ui.tab === "dead") v.innerHTML = viewDead();
  else v.innerHTML = viewScript();
  hydrate();
  lastOverdueSig = overdueSig();
  tick();
}

function rowDelete(id){ return '<button class="x" data-act="delete" data-id="' + id + '" title="Delete">&times;</button>'; }

function viewLeads(){
  var now = Date.now();
  var waiting = state.leads.filter(function(l){ return l.status === "waiting"; });
  if (!waiting.length) return noMatch("No open leads. Add a handle above the moment you send a first DM.");

  // one column per message they are waiting on
  var cols = [
    { kind:"followup", title:"1st follow-up", rule:"Day 3 after the first DM" },
    { kind:"meme",     title:"2nd follow-up", rule:"Day 7, the meme nudge" },
    { kind:"final",    title:"No reply",      rule:"Both nudges sent, ready to archive" }
  ];
  var shown = 0;
  cols.forEach(function(c){
    c.leads = filterList(waiting.filter(function(l){ return phaseOf(l).kind === c.kind; })
      .sort(function(a, b){ return sortKey(a, now) - sortKey(b, now); }), ui.q);   // overdue first
    c.overdue = c.leads.filter(function(l){ return cdText(l, now).due; }).length;
    shown += c.leads.length;
  });
  if (!shown) return noMatch("No open leads.");

  return '<div class="board">' + cols.map(function(c){
    return '<div class="bcol">' +
      '<div class="bhead' + (c.overdue ? " hot" : "") + '"><div class="bt"><h3>' + esc(c.title) + "</h3>" +
        '<span class="bn">' + (c.overdue ? c.overdue + " due" : c.leads.length) + "</span></div>" +
        '<div class="brule">' + esc(c.rule) + "</div></div>" +
      '<div class="bcards">' + (c.leads.length ? c.leads.map(leadCard).join("")
        : '<div class="bempty">Nothing here</div>') + "</div></div>";
  }).join("") + "</div>" + xtabHint();
}

function leadCard(l){
  var c = cdText(l, Date.now()), p = phaseOf(l);
  var acts = '<button class="mini go" data-act="replied" data-id="' + l.id +
    '" title="They replied. Moves them into the conversation pipeline">Replied</button>';
  var when;
  if (p.kind === "followup"){
    acts += '<button class="mini chase" data-act="followup" data-id="' + l.id + '">Follow-up sent</button>';
    when = "First DM " + fmtShort(l.firstDmAt);
  } else if (p.kind === "meme"){
    acts += '<button class="mini chase" data-act="meme" data-id="' + l.id + '">Meme sent</button>';
    when = "Follow-up " + fmtShort(l.followUp1SentAt);
  } else {
    acts += '<button class="mini" data-act="archive" data-id="' + l.id + '">Archive</button>';
    when = "Meme " + fmtShort(l.memeSentAt);
  }
  return '<div class="lcard' + (c.due ? " due" : "") + '" data-row="' + l.id + '">' +
    '<div class="ltop"><span class="handle">@' + hl(l.handle) + "</span>" +
      '<span class="cd pill' + (c.due ? " due" : "") + (c.final ? " final" : "") + '" data-cd="' + l.id + '">' + c.text + "</span></div>" +
    '<div class="lmeta">' + when + "</div>" +
    '<div class="acts">' + acts + rowDelete(l.id) + "</div></div>";
}

/* empty state: plain message normally, match-aware while searching */
function noMatch(plain){
  if (!ui.q) return '<div class="empty">' + plain + "</div>";
  return '<div class="empty">No leads here matching "' + esc(ui.q) + '"</div>' + xtabHint();
}
/* where else the current query matches, as buttons that switch tab */
function xtabHint(){
  if (!ui.q) return "";
  var c = {leads:0, respond:0, dead:0};
  state.leads.forEach(function(l){ if (matchRank(l.handle, ui.q) > -1) c[tabOf(l)]++; });
  var others = TABS.filter(function(t){ return c[t.id] > 0 && t.id !== ui.tab; });
  if (!others.length) return "";
  return '<div class="xtab"><span>Also matching:</span>' + others.map(function(t){
    return '<button class="mini" data-tab="' + t.id + '">' + esc(t.label) + " (" + c[t.id] + ")</button>";
  }).join("") + "</div>";
}

function viewRespond(){
  var active = filterList(state.leads.filter(function(l){ return l.status === "responded"; })
    .sort(function(a,b){ return chaseAnchor(a) - chaseAnchor(b); }), ui.q);   // stalest conversation first
  var parked = filterList(state.leads.filter(function(l){ return l.status === "parked"; })
    .sort(function(a,b){ return (a.parkedUntil || 0) - (b.parkedUntil || 0); }), ui.q);
  var clients = filterList(state.leads.filter(function(l){ return l.status === "client"; })
    .sort(function(a,b){ return (b.goldenQAt || b.createdAt) - (a.goldenQAt || a.createdAt); }), ui.q);

  var due = parked.filter(function(l){ return l.parkedUntil && l.parkedUntil <= Date.now(); }).length;
  if (due) ui.parkedOpen = true;

  var html = "";
  if (!active.length && !parked.length && !clients.length) return noMatch("Nobody in conversation right now.");
  if (!active.length) html += '<div class="empty">' + (ui.q ? 'No active conversations matching "' + esc(ui.q) + '"' : "Nobody in conversation right now.") + "</div>";
  else html += "<section>" + active.map(convoRow).join("") + "</section>";

  if (parked.length){
    html += '<div class="sechead click' + (due ? " alert" : "") + '" data-toggle="parked">' +
      "<span>" + (ui.parkedOpen ? "▾" : "▸") + " Parked</span>" +
      '<span class="cnt">' + parked.length + (due ? " · " + due + " to resurface" : "") + "</span>" +
      '<span class="line"></span></div>';
    if (ui.parkedOpen) html += "<section>" + parked.map(parkedRow).join("") + "</section>";
  }

  if (clients.length){
    html += '<div class="sechead"><span>Clients</span><span class="cnt">' + clients.length + '</span><span class="line"></span></div>' +
      "<section>" + clients.map(convoRow).join("") + "</section>";
  }
  return html + xtabHint();
}

function convoRow(l){
  var idx = STAGES.indexOf(l.stage);
  var opts = STAGES.map(function(s){
    return '<option value="' + s + '"' + (s === l.stage ? " selected" : "") + ">" + s + "</option>";
  }).join("");
  var open = !!ui.notesOpen[l.id];
  var hasNotes = l.notes && l.notes.trim().length > 0;

  var html = '<div class="row" data-row="' + l.id + '">' +
    '<div class="rowmain"><span class="handle">@' + hl(l.handle) + "</span>";
  if (l.status === "responded"){
    var c = chaseText(l, Date.now());
    html += '<span class="cd' + (c.due ? " due" : "") + '" data-cd="' + l.id + '">' + c.text + "</span>";
  }
  if (l.goldenQAt) html += '<span class="meta">Golden Q ' + fmtDate(l.goldenQAt) + "</span>";
  html += notesPreview(l);
  html += "</div>" +
    '<div class="acts">' +
    '<select class="stage' + (idx >= GOLDEN_IDX ? " gold" : "") + '" data-stage="' + l.id + '">' + opts + "</select>" +
    '<button class="mini" data-toggle-notes="' + l.id + '">' + (open ? "Hide notes" : (hasNotes ? "Edit notes" : "Notes")) + "</button>";
  if (l.status !== "client"){
    html += '<button class="mini" data-act="recontact" data-id="' + l.id + '" title="They replied, or you messaged. Restarts the chase clock">Replied</button>' +
            '<button class="mini" data-act="park" data-id="' + l.id + '">Park</button>' +
            '<button class="mini danger" data-act="dead" data-id="' + l.id + '">Dead</button>';
  }
  html += rowDelete(l.id) + "</div>";
  html += progressBar(l);
  if (open){
    html += '<div class="notes"><textarea data-notes="' + l.id + '" placeholder="their goal + pain in their exact words (for the mirror message)"></textarea></div>';
  }
  return html + "</div>";
}

function parkedRow(l){
  var now = Date.now();
  var overdue = l.parkedUntil && l.parkedUntil <= now;
  var txt = overdue ? "RESURFACE" : "Resurface in " + fmtLeft(l.parkedUntil - now);
  return '<div class="row' + (overdue ? " due" : "") + '" data-row="' + l.id + '">' +
    '<div class="rowmain"><span class="handle">@' + hl(l.handle) + "</span>" +
    '<span class="cd' + (overdue ? " due" : "") + '" data-cd="' + l.id + '">' + txt + "</span>" +
    '<span class="meta">' + esc(l.stage || "Control Q") + "</span>" + notesPreview(l) + "</div>" +
    '<div class="acts">' +
      '<button class="mini primary" data-act="unpark" data-id="' + l.id + '">Unpark</button>' +
      '<button class="mini" data-toggle-notes="' + l.id + '">Notes</button>' +
      '<button class="mini danger" data-act="dead" data-id="' + l.id + '">Dead</button>' +
      rowDelete(l.id) +
    "</div>" +
    progressBar(l) +
    (ui.notesOpen[l.id] ? '<div class="notes"><textarea data-notes="' + l.id + '" placeholder="their goal + pain in their exact words (for the mirror message)"></textarea></div>' : "") +
    "</div>";
}

function viewDead(){
  var list = filterList(state.leads.filter(function(l){ return l.status === "no_response"; })
    .sort(function(a,b){ return (b.archivedAt || 0) - (a.archivedAt || 0); }), ui.q);
  if (!list.length) return noMatch("Nothing archived yet.");
  return "<section>" + list.map(function(l){
    return '<div class="row" data-row="' + l.id + '">' +
      '<div class="rowmain"><span class="handle">@' + hl(l.handle) + "</span>" +
      '<span class="meta">Archived ' + fmtDate(l.archivedAt) + "</span></div>" +
      '<div class="acts"><button class="mini" data-act="revive" data-id="' + l.id + '">Revive</button>' +
      rowDelete(l.id) + "</div></div>";
  }).join("") + "</section>" + xtabHint();
}

/* ---------------- statistics ---------------- */
function startOfDay(ts){ var d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function fmtShort(ts){
  var d = new Date(ts);
  return d.getDate() + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
}

function dailySeries(days){
  var today = startOfDay(Date.now());
  var out = [], idx = {};
  for (var i = days - 1; i >= 0; i--){
    var t = today - i * DAY;
    idx[t] = out.length;
    out.push({ t:t, opens:0, replies:0, chases:0 });
  }
  function bump(ts, field){
    if (!ts) return;
    var k = startOfDay(ts);
    if (idx[k] != null) out[idx[k]][field]++;
  }
  state.leads.forEach(function(l){
    bump(l.firstDmAt, "opens");
    bump(l.repliedAt, "replies");
    bump(l.followUp1SentAt, "chases");
    bump(l.memeSentAt, "chases");
  });
  return out;
}

function funnelData(){
  function n(fn){ return state.leads.filter(fn).length; }
  return [
    { label:"First DM sent",  n:state.leads.length, c:"var(--dim)" },
    { label:"Replied",        n:n(function(l){ return l.repliedAt !== null; }), c:"var(--b1)" },
    { label:"Golden Q asked", n:n(function(l){ return l.goldenQAt !== null; }), c:"var(--b2)" },
    { label:"Call booked",    n:n(function(l){ return l.stage && STAGES.indexOf(l.stage) >= CALL_IDX; }), c:"var(--b3)" },
    { label:"Signed client",  n:n(function(l){ return l.status === "client"; }), c:"var(--b4)" }
  ];
}

function statusSplit(){
  var m = { waiting:0, responded:0, parked:0, client:0, no_response:0 };
  state.leads.forEach(function(l){ if (m[l.status] != null) m[l.status]++; });
  return [
    { label:"Waiting on reply", v:m.waiting,     c:"var(--dim)" },
    { label:"In conversation",  v:m.responded,   c:"var(--b2)" },
    { label:"Parked",           v:m.parked,      c:"var(--b1)" },
    { label:"Clients",          v:m.client,      c:"var(--b4)" },
    { label:"No reply",         v:m.no_response, c:"var(--r2)" }
  ];
}

/* how punctual the day-3 and day-7 nudges actually were */
function punctuality(){
  var b = [0,0,0,0,0];
  function add(diff){
    if (diff <= 0) b[0]++;
    else b[Math.min(Math.ceil(diff / DAY), 4)]++;
  }
  state.leads.forEach(function(l){
    if (l.followUp1SentAt) add(l.followUp1SentAt - (l.firstDmAt + FOLLOWUP_AFTER));
    if (l.memeSentAt) add(l.memeSentAt - (l.firstDmAt + MEME_AFTER));
  });
  return [
    { label:"On time",      v:b[0], c:"var(--b2)" },
    { label:"1 day late",   v:b[1], c:"var(--r4)" },
    { label:"2 days late",  v:b[2], c:"var(--r3)" },
    { label:"3 days late",  v:b[3], c:"var(--r2)" },
    { label:"4+ days late", v:b[4], c:"var(--r1)" }
  ];
}

var STAGE_SHORT = ["Ctrl","Goal","Pain","Mirror","Golden","Ties","Call","Client"];
function stageCounts(){
  return STAGES.map(function(s, i){
    return { label:s, short:STAGE_SHORT[i], v:state.leads.filter(function(l){
      return l.stage === s && l.status !== "no_response" && l.status !== "waiting";
    }).length };
  });
}

function weekdayCounts(days){
  var names = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], c = [0,0,0,0,0,0,0];
  var since = startOfDay(Date.now()) - (days - 1) * DAY;
  state.leads.forEach(function(l){
    if (l.firstDmAt < since) return;
    c[(new Date(l.firstDmAt).getDay() + 6) % 7]++;
  });
  return names.map(function(nm, i){ return { label:nm, v:c[i] }; });
}

/* what needs doing right now, across every tab */
function attention(){
  var now = Date.now(), a = { followup:0, meme:0, archive:0, quiet:0, resurface:0 };
  state.leads.forEach(function(l){
    if (l.status === "waiting"){
      var p = phaseOf(l);
      if (p.kind === "final") a.archive++;
      else if (p.target <= now){ if (p.kind === "meme") a.meme++; else a.followup++; }
    } else if (l.status === "responded"){
      if (chaseText(l, now).due) a.quiet++;
    } else if (l.status === "parked"){
      if (l.parkedUntil && l.parkedUntil <= now) a.resurface++;
    }
  });
  return a;
}

/* ---- chart builders ---- */
function meter(label, done, target){
  var pct = target > 0 ? Math.min(100, Math.round(done / target * 100)) : (done > 0 ? 100 : 0);
  var cls = (target > 0 && done >= target) ? " done" : (done === 0 ? " zero" : "");
  return '<div class="meter"><div class="top"><span class="lbl">' + esc(label) + "</span>" +
    '<span class="val">' + done + "<i> / " + target + "</i></span></div>" +
    '<div class="mtrack"><div class="mfill' + cls + '" style="width:' + pct + '%"></div></div></div>';
}

function funnelChart(){
  var d = funnelData(), top = Math.max(1, d[0].n);
  return '<div class="fn">' + d.map(function(row, i){
    var w = Math.round(row.n / top * 100);
    var conv = i === 0 ? "" :
      '<span> ' + (d[i-1].n ? Math.round(row.n / d[i-1].n * 100) : 0) + "%</span>";
    var tip = row.label + ": " + row.n + " of " + top + " leads (" + w + "%)" +
      (i === 0 ? "" : "\n" + (d[i-1].n ? Math.round(row.n / d[i-1].n * 100) : 0) + "% of " + d[i-1].label.toLowerCase());
    return '<div class="fnrow"><span class="fl">' + esc(row.label) + "</span>" +
      '<div class="ftrack"><div class="ffill" style="width:' + w + "%;background:" + row.c + '" data-tip="' + esc(tip) + '"></div></div>' +
      '<span class="fv">' + row.n + conv + "</span></div>";
  }).join("") + "</div>";
}

function donut(segs){
  var total = 0;
  segs.forEach(function(s){ total += s.v; });
  var size = 132, sw = 15, r = (size - sw) / 2, c = 2 * Math.PI * r, mid = size / 2;
  var svg = '<svg viewBox="0 0 ' + size + " " + size + '" width="' + size + '" height="' + size + '" role="img">';
  if (!total){
    svg += '<circle cx="' + mid + '" cy="' + mid + '" r="' + r + '" fill="none" stroke="var(--track)" stroke-width="' + sw + '"/>';
  } else {
    var off = 0;
    segs.forEach(function(s){
      if (!s.v) return;
      var len = s.v / total * c;
      var draw = Math.max(1, len - 2);   /* 2px surface gap between segments */
      svg += '<circle cx="' + mid + '" cy="' + mid + '" r="' + r + '" fill="none" stroke="' + s.c +
        '" stroke-width="' + sw + '" stroke-dasharray="' + draw.toFixed(2) + " " + (c - draw).toFixed(2) +
        '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 ' + mid + " " + mid + ')"' +
        ' data-tip="' + esc(s.label + ": " + s.v + " (" + Math.round(s.v / total * 100) + "%)") + '"/>';
      off += len;
    });
  }
  svg += '<text x="' + mid + '" y="' + (mid - 1) + '" text-anchor="middle" fill="#E9ECF2" font-size="23" font-weight="650">' + total + "</text>" +
    '<text x="' + mid + '" y="' + (mid + 16) + '" text-anchor="middle" fill="#757F90" font-size="10">total</text></svg>';
  var leg = '<div class="leg">' + segs.map(function(s){
    return '<div class="li"><span class="sw" style="background:' + s.c + '"></span>' +
      '<span class="ln">' + esc(s.label) + '</span><span class="lv">' + s.v + "</span>" +
      '<span class="lp">' + (total ? Math.round(s.v / total * 100) : 0) + "%</span></div>";
  }).join("") + "</div>";
  return '<div class="dnwrap">' + svg + leg + "</div>";
}

function columns(items, unit){
  var max = 1;
  items.forEach(function(i){ if (i.v > max) max = i.v; });
  return '<div class="cols">' + items.map(function(i){
    return '<div class="col" data-tip="' + esc(i.label + ": " + i.v + " " + unit) + '">' +
      '<span class="cval">' + (i.v || "") + "</span>" +
      '<div class="cplot"><div class="cbar" style="height:' + Math.round(i.v / max * 100) + '%"></div></div>' +
      '<span class="clab">' + esc(i.short || i.label) + "</span></div>";
  }).join("") + "</div>";
}

/* emphasis form: volume is context in grey, replies are the point in accent blue */
function activityChart(series){
  var W = 720, H = 200, pl = 28, pr = 6, pt = 10, pb = 26;
  var peak = 1;
  series.forEach(function(d){
    if (d.opens > peak) peak = d.opens;
    if (d.replies > peak) peak = d.replies;
  });
  var step = Math.max(1, Math.ceil(peak / 4)), max = step * 4, n = series.length;
  function X(i){ return n < 2 ? pl : pl + i * (W - pl - pr) / (n - 1); }
  function Y(v){ return pt + (1 - v / max) * (H - pt - pb); }

  var svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Outreach activity over time">';
  for (var g = 0; g <= max; g += step){
    svg += '<line class="gridline" x1="' + pl + '" y1="' + Y(g) + '" x2="' + (W - pr) + '" y2="' + Y(g) + '"/>' +
      '<text class="axlab" x="' + (pl - 6) + '" y="' + (Y(g) + 3.5) + '" text-anchor="end">' + g + "</text>";
  }
  var i, area = "M" + X(0).toFixed(1) + " " + Y(series[0].opens).toFixed(1);
  for (i = 1; i < n; i++) area += " L" + X(i).toFixed(1) + " " + Y(series[i].opens).toFixed(1);
  area += " L" + X(n-1).toFixed(1) + " " + Y(0) + " L" + X(0).toFixed(1) + " " + Y(0) + " Z";
  svg += '<path d="' + area + '" fill="rgba(101,111,127,.22)"/>';
  var lineO = "M" + X(0).toFixed(1) + " " + Y(series[0].opens).toFixed(1);
  for (i = 1; i < n; i++) lineO += " L" + X(i).toFixed(1) + " " + Y(series[i].opens).toFixed(1);
  svg += '<path d="' + lineO + '" fill="none" stroke="#656F7F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  var lineR = "M" + X(0).toFixed(1) + " " + Y(series[0].replies).toFixed(1);
  for (i = 1; i < n; i++) lineR += " L" + X(i).toFixed(1) + " " + Y(series[i].replies).toFixed(1);
  svg += '<path d="' + lineR + '" fill="none" stroke="#2F6DFF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';

  var every = Math.max(1, Math.ceil(n / 6));
  for (i = 0; i < n; i += every){
    svg += '<text class="axlab" x="' + X(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + fmtShort(series[i].t) + "</text>";
  }
  var bw = (W - pl - pr) / n;
  for (i = 0; i < n; i++){
    var d = series[i];
    svg += '<rect class="hit" x="' + (X(i) - bw/2).toFixed(1) + '" y="' + pt + '" width="' + bw.toFixed(1) +
      '" height="' + (H - pt - pb) + '" data-tip="' + esc(fmtShort(d.t) + "\n" +
      plural(d.opens, "first DM") + " sent\n" + plural(d.replies, "reply", "replies") + "\n" +
      plural(d.chases, "chase") + " sent") + '"/>';
  }
  return svg + "</svg>";
}

function viewStats(){
  if (!state.leads.length){
    return '<div class="empty">Nothing to chart yet. Log your first DM in the bar above and this fills in.</div>';
  }
  var days = ui.range, series = dailySeries(days), today = series[series.length - 1];
  var f = funnelData(), a = attention(), wk = mondayStart();
  var goldenToday = state.leads.filter(function(l){ return l.goldenQAt && l.goldenQAt >= startOfDay(Date.now()); }).length;
  var chasesDue = a.followup + a.meme, chasesDone = today.chases;
  var rangeTotals = series.reduce(function(m, d){
    m.opens += d.opens; m.replies += d.replies; m.chases += d.chases; return m;
  }, { opens:0, replies:0, chases:0 });

  var html = '<div class="srow"><div class="seg">' + [7,30,90].map(function(d){
    return '<button data-range="' + d + '" class="' + (days === d ? "on" : "") + '">' + d + " days</button>";
  }).join("") + "</div><span class=\"sp\"></span></div>";

  /* today */
  html += '<div class="grid2">' +
    '<div class="card"><h4>Today</h4><div class="csub">' + fmtDate(Date.now()) + "</div>" +
      meter("First DMs sent", today.opens, DAILY_TARGET) +
      meter("Chases cleared", chasesDone, Math.max(chasesDone + chasesDue, 1)) +
      meter("Golden Qs asked", goldenToday, GOLDEN_DAILY_TARGET) +
    "</div>" +
    '<div class="card"><h4>Needs you now</h4><div class="csub">Click through to the tab</div>';
  var chips = [];
  if (a.followup) chips.push('<button class="chip hot" data-tab="leads">' + plural(a.followup, "follow-up") + " due</button>");
  if (a.meme) chips.push('<button class="chip hot" data-tab="leads">' + plural(a.meme, "meme") + " due</button>");
  if (a.quiet) chips.push('<button class="chip hot" data-tab="respond">' + plural(a.quiet, "conversation") + " gone quiet</button>");
  if (a.resurface) chips.push('<button class="chip hot" data-tab="respond">' + plural(a.resurface, "lead") + " to resurface</button>");
  if (a.archive) chips.push('<button class="chip" data-tab="leads">' + plural(a.archive, "lead") + " to archive</button>");
  html += chips.length ? '<div class="chips">' + chips.join("") + "</div>"
                       : '<div class="allclear">All clear. Nothing overdue right now.</div>';
  html += "</div></div>";

  /* activity */
  html += '<div class="card"><h4>Outreach activity</h4><div class="csub">Last ' + days + " days: " +
    rangeTotals.opens + " first DMs, " + rangeTotals.replies + " replies, " + rangeTotals.chases + " chases</div>" +
    '<div class="legrow">' +
      '<span class="li"><span class="sw" style="background:#656F7F"></span>First DMs sent</span>' +
      '<span class="li"><span class="sw" style="background:#2F6DFF"></span>Replies received</span>' +
    "</div>" +
    '<div class="chartbox">' + activityChart(series) + "</div>" +
    '<details class="dt"><summary>Show the numbers</summary><div class="tscroll"><table>' +
      "<tr><th>Day</th><th>First DMs</th><th>Replies</th><th>Chases</th></tr>" +
      series.slice().reverse().filter(function(d){ return d.opens || d.replies || d.chases; }).map(function(d){
        return "<tr><td>" + fmtShort(d.t) + "</td><td>" + d.opens + "</td><td>" + d.replies + "</td><td>" + d.chases + "</td></tr>";
      }).join("") +
    "</table></div></details></div>";

  /* conversion rates */
  function rate(n, of){ return of ? Math.round(n / of * 100) : 0; }
  html += '<div class="grid4">' +
    tile("Reply rate", rate(f[1].n, f[0].n) + "%", f[1].n + " of " + f[0].n + " opened") +
    tile("Golden Q rate", rate(f[2].n, f[1].n) + "%", f[2].n + " of " + f[1].n + " replies") +
    tile("Call rate", rate(f[3].n, f[2].n) + "%", f[3].n + " of " + f[2].n + " Golden Qs") +
    tile("Close rate", rate(f[4].n, f[3].n) + "%", f[4].n + " of " + f[3].n + " calls") +
  "</div>";

  /* funnel */
  html += '<div class="card"><h4>Pipeline funnel</h4><div class="csub">All leads ever. The small number is the step conversion.</div>' +
    funnelChart() + "</div>";

  /* two donuts */
  html += '<div class="grid2">' +
    '<div class="card"><h4>Where everyone sits</h4><div class="csub">Current pipeline split</div>' + donut(statusSplit()) + "</div>" +
    '<div class="card"><h4>Chase punctuality</h4><div class="csub">Day 3 and day 7 nudges, against when they were due</div>' + donut(punctuality()) + "</div>" +
  "</div>";

  /* stage + weekday */
  html += '<div class="grid2">' +
    '<div class="card"><h4>Live conversations by stage</h4><div class="csub">Everyone still in play</div>' +
      columns(stageCounts(), "leads") + "</div>" +
    '<div class="card"><h4>Which days you actually open</h4><div class="csub">First DMs by weekday, last ' + days + " days</div>" +
      columns(weekdayCounts(days), "first DMs") + "</div>" +
  "</div>";

  return html;
}

function tile(k, big, sub){
  return '<div class="card tile"><h4>' + esc(k) + '</h4><div class="big">' + big + "</div>" +
    '<div class="sub">' + esc(sub) + "</div></div>";
}

function viewScript(){
  var html = SCRIPT.map(function(s){
    var done = !!state.scriptChecks[s.id];
    var body = s.items.map(function(it){
      if (it.t === "n") return '<p class="note">' + esc(it.x) + "</p>";
      return '<div class="quote"><p>' + esc(it.x) + '</p>' +
        '<button class="mini" data-copy="' + esc(it.x) + '">Copy</button></div>';
    }).join("");
    return '<div class="stage' + (done ? " done" : "") + '">' +
      '<div class="top"><input type="checkbox" data-check="' + s.id + '"' + (done ? " checked" : "") + ">" +
      "<div><h3>" + esc(s.title) + "</h3>" + (s.sub ? '<div class="sub">(' + esc(s.sub) + ")</div>" : "") + "</div></div>" +
      body + "</div>";
  }).join("");
  return html + '<div style="padding:6px 0 2px"><button class="mini" id="resetChecks">Reset checkpoints</button></div>' +
    savedPrompts();
}

/* prompts kept for pasting elsewhere, parked at the bottom so they stay out of the way */
function savedPrompts(){
  var el = document.getElementById("aiPromptSrc");
  if (!el) return "";
  var txt = el.textContent.replace(/^\s*\n/, "").replace(/\s+$/, "");
  var words = txt.split(/\s+/).length;
  return '<div class="sechead"><span>Saved prompts</span><span class="line"></span></div>' +
    '<details class="pbox"><summary>AI reply drafting, full build spec</summary>' +
      '<div class="pbar"><span class="phint">' + words + " words. Paste into Claude Code to build the feature.</span>" +
      '<button class="mini primary" data-copy-src="aiPromptSrc">Copy prompt</button></div>' +
      '<pre class="ptext">' + esc(txt) + "</pre>" +
    "</details>";
}

/* ---------------- hydrate + events ---------------- */
function hydrate(){
  // fill textareas without going through innerHTML
  Array.prototype.forEach.call(document.querySelectorAll("[data-notes]"), function(ta){
    var l = byId(ta.getAttribute("data-notes"));
    if (l) ta.value = l.notes || "";
  });
}

document.addEventListener("click", function(e){
  var t = e.target;

  var copy = t.closest("[data-copy]");
  if (copy){ doCopy(copy.getAttribute("data-copy"), copy); return; }

  // long text lives in a text/plain block rather than an attribute
  var copySrc = t.closest("[data-copy-src]");
  if (copySrc){
    var src = document.getElementById(copySrc.getAttribute("data-copy-src"));
    if (src) doCopy(src.textContent.replace(/^\s*\n/, "").replace(/\s+$/, ""), copySrc);
    return;
  }

  var a = t.closest("[data-act]");
  if (a){ act(a.getAttribute("data-id"), a.getAttribute("data-act")); return; }

  var n = t.closest("[data-toggle-notes]");
  if (n){
    var id = n.getAttribute("data-toggle-notes");
    ui.notesOpen[id] = !ui.notesOpen[id];
    render();
    var ta = document.querySelector('[data-notes="' + id + '"]');
    if (ta) ta.focus();
    return;
  }

  var sec = t.closest("[data-toggle]");
  if (sec){ ui.parkedOpen = !ui.parkedOpen; render(); return; }

  var rng = t.closest("[data-range]");
  if (rng){ ui.range = parseInt(rng.getAttribute("data-range"), 10) || 30; render(); return; }

  var tab = t.closest("[data-tab]");
  if (tab){ ui.tab = tab.getAttribute("data-tab"); clearFlash(); render(); return; }

  if (t.id === "resetChecks"){ state.scriptChecks = {}; save(); render(); return; }
});

document.addEventListener("change", function(e){
  var t = e.target;
  var st = t.getAttribute && t.getAttribute("data-stage");
  if (st){ setStage(st, t.value); return; }
  var ck = t.getAttribute && t.getAttribute("data-check");
  if (ck){ state.scriptChecks[ck] = t.checked; save(); render(); return; }
});

document.addEventListener("input", function(e){
  var id = e.target.getAttribute && e.target.getAttribute("data-notes");
  if (!id) return;
  var l = byId(id);
  if (!l) return;
  l.notes = e.target.value;
  save();
});

/* quick add */
var qa = document.getElementById("qa");
document.getElementById("qaBtn").addEventListener("click", function(){ submitAdd(); });
qa.addEventListener("keydown", function(e){

/* search */

sq.addEventListener("input", function(){ ui.q = normQ(sq.value); render(); });

function submitAdd(){
  var ok = addLead(qa.value);

/* copy */
function doCopy(text, btn){
  var done = function(){
    var old = btn.textContent;
    btn.textContent = "Copied";
    setTimeout(function(){ btn.textContent = old; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ legacyCopy(text, done); });
  } else legacyCopy(text, done);
}
function legacyCopy(text, done){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch(e){ flash("Copy failed, select the text manually.", false); }
  document.body.removeChild(ta);
}

/* ---------------- chart tooltips ---------------- */
var tipEl = document.getElementById("tip");
document.addEventListener("mousemove", function(e){
  var host = e.target && e.target.closest ? e.target.closest("[data-tip]") : null;
  if (!host){ if (tipEl.className) tipEl.className = ""; return; }
  var txt = host.getAttribute("data-tip");
  if (tipEl.textContent !== txt) tipEl.textContent = txt;
  tipEl.className = "on";
  var r = tipEl.getBoundingClientRect(), pad = 14;
  var x = e.clientX + pad, y = e.clientY + pad;
  if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
  tipEl.style.left = Math.max(8, x) + "px";
  tipEl.style.top = Math.max(8, y) + "px";
});
document.addEventListener("mouseleave", function(){ tipEl.className = ""; });
window.addEventListener("scroll", function(){ tipEl.className = ""; }, true);

/* ---------------- export / import ---------------- */
document.getElementById("exportBtn").addEventListener("click", function(){
  var d = new Date();
  var name = "dm-tracker-backup-" + d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + ".json";
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  flash("Exported " + name, true);
});

document.getElementById("importBtn").addEventListener("click", function(){
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", function(e){
  var f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    var parsed;
    try { parsed = JSON.parse(r.result); }
    catch(err){ flash("That file is not valid JSON.", false); return; }
    if (!parsed || !Array.isArray(parsed.leads)){ flash("That file does not look like a tracker backup.", false); return; }
    if (!confirm("Import " + plural(parsed.leads.length, "lead") + "? This overwrites all current data (" + plural(state.leads.length, "lead") + ").")) return;
    state = {
      leads: parsed.leads.filter(function(l){ return l && typeof l.handle === "string"; }).map(normalise),
      scriptChecks: (parsed.scriptChecks && typeof parsed.scriptChecks === "object") ? parsed.scriptChecks : {}
    };
    ui.notesOpen = {};
    save();
    render();
    flash("Imported " + plural(state.leads.length, "lead") + ".", true);
  };
  r.readAsText(f);
});

/* ---------------- tick ---------------- */
function overdueSig(){
  var now = Date.now();
  return state.leads.map(function(l){
    if (l.status === "waiting"){
      var p = phaseOf(l);
      return p.kind === "final" ? "f" : (p.target <= now ? "1" : "0");
    }
    if (l.status === "parked") return (l.parkedUntil && l.parkedUntil <= now) ? "1" : "0";
    if (l.status === "responded") return "r" + chaseText(l, now).level;
    return "-";
  }).join("");
}

function tick(){
  var now = Date.now();
  var els = document.querySelectorAll("[data-cd]");
  for (var i=0;i<els.length;i++){
    var el = els[i];
    var l = byId(el.getAttribute("data-cd"));
    if (!l) continue;
    var text, due = false, final = false;
    if (l.status === "parked"){
      due = !!(l.parkedUntil && l.parkedUntil <= now);
      text = due ? "RESURFACE" : "Resurface in " + fmtLeft(l.parkedUntil - now);
    } else if (l.status === "responded"){
      var cc = chaseText(l, now);
      text = cc.text; due = cc.due;
    } else {
      var c = cdText(l, now);
      text = c.text; due = c.due; final = c.final;
    }
    if (el.textContent !== text) el.textContent = text;
    // toggle, never reassign: these elements also carry pill / lcard / row classes
    el.classList.toggle("due", due);
    el.classList.toggle("final", final);
    var row = el.closest("[data-row]");
    if (row) row.classList.toggle("due", due);
  }
  // re-sort / re-group when something crosses zero, unless the user is typing
  var sig = overdueSig();
  if (sig !== lastOverdueSig){
    var ae = document.activeElement;
    var busy = ae && (ae.tagName === "TEXTAREA" || (ae.tagName === "INPUT" && ae.id === "qa" && ae.value));
    if (!busy){ render(); return; }
    // still typing — leave the signature alone so we retry on the next tick
  }
}

/* ---------------- boot ---------------- */
document.getElementById("today").textContent = fmtDate(Date.now());
render();
setInterval(tick, 1000);
qa.focus();
window.addEventListener("storage", function(e){
  if (e.key === KEY){ state = load(); render(); }
});
})();

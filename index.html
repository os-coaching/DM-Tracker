<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DM Tracker">
<meta name="theme-color" content="#0057FF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230057FF'/><path d='M8 21V11h5.2c3 0 4.9 2 4.9 5s-1.9 5-4.9 5H8Zm3-2.4h2c1.4 0 2.2-1 2.2-2.6s-.8-2.6-2.2-2.6h-2v5.2Z' fill='white'/><circle cx='23' cy='19.5' r='2' fill='white'/></svg>">
<title>DM Outreach Tracker</title>
<style>
:root{
  --accent:#0057FF;
  --accent-soft:#E8EFFF;
  --red:#D92D20;
  --red-soft:#FDECEA;
  --text:#111318;
  --muted:#6B7280;
  --line:#E7E9EE;
  --line-soft:#F1F3F7;
  --bg:#FFFFFF;
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text)}
body{
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:64px;
}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:baseline;gap:10px;padding:16px 0 12px}
.brand h1{font-size:16px;font-weight:650;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}

/* stats strip */
.stats{display:flex;gap:8px;padding-bottom:14px}
.stat{
  flex:1 1 0;min-width:0;border:1px solid var(--line);border-radius:var(--radius);
  padding:8px 10px;
}
.stat .k{
  font-size:10px;line-height:1.3;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  min-height:26px;
}
.stat .v{font-size:19px;font-weight:650;letter-spacing:-.02em;margin-top:2px}
.stat .v em{font-style:normal;color:var(--muted);font-weight:500;font-size:14px}

/* tabs */
nav{display:flex;gap:2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  appearance:none;background:none;border:none;border-bottom:2px solid transparent;
  font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer;
  padding:9px 12px;white-space:nowrap;
}
nav button .n{
  font-size:11px;color:var(--muted);background:var(--line-soft);
  border-radius:20px;padding:1px 6px;margin-left:6px;
}
nav button:hover{color:var(--text)}
nav button .short{display:none}
nav button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav button.on .n{background:var(--accent-soft);color:var(--accent)}

/* quick add */
.quick{display:flex;gap:8px;padding:12px 0 12px}
.quick input{
  flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--radius);background:#fff;color:var(--text);
}
.quick input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.quick input::placeholder{color:#9AA1AC}

/* buttons */
button.btn{
  appearance:none;font:inherit;font-size:13px;cursor:pointer;border-radius:var(--radius);
  padding:9px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-weight:550;
  white-space:nowrap;
}
button.btn:hover{filter:brightness(.93)}
button.mini{
  appearance:none;font:inherit;font-size:12px;cursor:pointer;border-radius:6px;
  padding:5px 9px;border:1px solid var(--line);background:#fff;color:var(--text);white-space:nowrap;
}
button.mini:hover{border-color:#C9CFDA;background:#FAFBFD}
button.mini.primary{border-color:var(--accent);background:var(--accent);color:#fff}
button.mini.primary:hover{filter:brightness(.93);background:var(--accent)}
button.mini.danger{color:var(--red);border-color:#F2C8C4}
button.mini.danger:hover{background:var(--red-soft)}
button.x{
  appearance:none;border:none;background:none;font:inherit;font-size:16px;line-height:1;
  color:#B8BEC9;cursor:pointer;padding:5px 6px;border-radius:6px;
}
button.x:hover{color:var(--red);background:var(--red-soft)}

/* flash */
.flash{
  display:none;margin-bottom:12px;padding:9px 12px;border-radius:var(--radius);
  font-size:13px;background:var(--red-soft);color:var(--red);border:1px solid #F2C8C4;
}
.flash.show{display:block}
.flash.ok{background:var(--accent-soft);color:var(--accent);border-color:#C6D8FF}

/* sections */
section{padding:4px 0 8px}
.sechead{
  display:flex;align-items:center;gap:8px;margin:26px 0 10px;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;
}
.sechead .line{flex:1;height:1px;background:var(--line)}
.sechead.click{cursor:pointer;user-select:none}
.sechead.click:hover{color:var(--text)}
.sechead .cnt{color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;font-size:12px}
.sechead.alert{color:var(--red)}

/* rows */
.row{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 0;border-bottom:1px solid var(--line-soft);
}
.row:last-child{border-bottom:none}
.row.due{background:var(--red-soft);border-radius:var(--radius);padding-left:12px;padding-right:12px;border-bottom-color:transparent;margin-bottom:1px}
.rowmain{display:flex;align-items:baseline;gap:12px;flex:1 1 240px;min-width:0;flex-wrap:wrap}
.handle{font-weight:600;font-size:14.5px;letter-spacing:-.01em;word-break:break-all}
.cd{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cd.due{color:var(--red);font-weight:650;letter-spacing:.02em}
.cd.final{color:var(--muted);font-style:italic}
.acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta{font-size:12.5px;color:var(--muted);white-space:nowrap}
select.stage{
  font:inherit;font-size:13px;padding:6px 26px 6px 9px;border:1px solid var(--line);
  border-radius:6px;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='%236B7280' stroke-width='1.5'/></svg>") no-repeat right 9px center;
  appearance:none;color:var(--text);cursor:pointer;
}
select.stage:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.stage.gold{border-color:var(--accent);color:var(--accent);font-weight:600}
.notes{flex:1 1 100%;margin:2px 0 4px}
.notes textarea{
  width:100%;font:inherit;font-size:13.5px;line-height:1.5;padding:10px 12px;
  border:1px solid var(--line);border-radius:var(--radius);resize:vertical;min-height:74px;color:var(--text);
}
.notes textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.notes textarea::placeholder{color:#9AA1AC}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:0 0 auto}

.empty{color:var(--muted);font-size:13.5px;padding:28px 0;text-align:center}

/* script tab */
.stage{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.stage.done{background:#FAFBFD;border-color:var(--line-soft)}
.stage .top{display:flex;align-items:flex-start;gap:10px}
.stage h3{font-size:13.5px;font-weight:650;letter-spacing:-.01em;flex:1}
.stage.done h3{color:var(--muted);text-decoration:line-through}
.stage .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.stage input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin-top:2px;flex:0 0 auto;cursor:pointer}
.quote{
  display:flex;align-items:flex-start;gap:10px;margin-top:10px;
  border-left:2px solid var(--accent);padding-left:12px;
}
.quote p{flex:1;font-size:14px;line-height:1.5}
.note{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.55}
.note strong{color:var(--text);font-weight:600}

footer{border-top:1px solid var(--line);margin-top:36px;padding:18px 0 30px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
footer .sp{flex:1}
footer .hint{font-size:12px;color:var(--muted)}

@media (max-width:620px){
  .wrap{padding:0 14px}
  .stats{gap:6px}
  .stat{padding:7px 8px}
  .stat .k{font-size:9px;letter-spacing:.04em;min-height:24px}
  .stat .v{font-size:16px}
  nav{gap:0}
  nav button{flex:1 1 0;padding:9px 4px;font-size:13px}
  nav button .full{display:none}
  nav button .short{display:inline}
  nav button .n{margin-left:4px;padding:1px 5px}
  .acts{width:100%}
  .rowmain{flex:1 1 100%}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand"><h1>DM Outreach Tracker</h1><span id="today"></span></div>
    <div class="stats" id="stats"></div>
    <nav id="nav"></nav>
    <div class="quick">
      <input id="qa" type="text" placeholder="@handle — enter to log first DM sent" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn" id="qaBtn">Add</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="flash" id="flash"></div>
  <div id="view"></div>
</main>

<footer class="wrap">
  <button class="mini" id="exportBtn">Export JSON</button>
  <button class="mini" id="importBtn">Import JSON</button>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <span class="sp"></span>
  <span class="hint" id="totalHint"></span>
</footer>

<script>
(function(){
"use strict";

/* ---------------- constants ---------------- */
var KEY = "dm_tracker_v1";
var STAGES = ["Control Q","Goal","Pain","Mirror","Golden Q","Tie Downs","Call Booked","Client"];
var GOLDEN_IDX = 4;
var CALL_IDX = 6;
var DAY = 86400000;
var FOLLOWUP_AFTER = 3 * DAY;
var MEME_AFTER = 7 * DAY;
var CHASE1_AFTER = 1 * DAY;
var CHASE2_AFTER = 3 * DAY;
var PARK_FOR = 21 * DAY;
var WEEKLY_TARGET = 25;
var TABS = [
  {id:"leads",  label:"Leads",              short:"Leads"},
  {id:"respond",label:"Leads That Respond", short:"Respond"},
  {id:"dead",   label:"Leads That Don't",   short:"Don't"},
  {id:"script", label:"Script",             short:"Script"}
];

/* ---------------- state ---------------- */
var state = load();
var ui = { tab:"leads", notesOpen:{}, parkedOpen:false, clientsOpen:true };
var lastOverdueSig = "";

function load(){
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){}
  var s = null;
  if (raw){ try { s = JSON.parse(raw); } catch(e){ s = null; } }
  if (!s || typeof s !== "object") s = {};
  if (!Array.isArray(s.leads)) s.leads = [];
  if (!s.scriptChecks || typeof s.scriptChecks !== "object") s.scriptChecks = {};
  s.leads = s.leads.filter(function(l){ return l && typeof l.handle === "string"; }).map(normalise);
  return s;
}
function normalise(l){
  return {
    id: l.id || uid(),
    handle: String(l.handle || "").toLowerCase().replace(/^@+/,"").trim(),
    firstDmAt: num(l.firstDmAt, Date.now()),
    followUp1SentAt: num(l.followUp1SentAt, null),
    memeSentAt: num(l.memeSentAt, null),
    repliedAt: num(l.repliedAt, null),
    lastReplyAt: num(l.lastReplyAt, num(l.repliedAt, num(l.createdAt, num(l.firstDmAt, Date.now())))),
    status: ["waiting","responded","no_response","parked","client"].indexOf(l.status) > -1 ? l.status : "waiting",
    stage: STAGES.indexOf(l.stage) > -1 ? l.stage : null,
    goldenQAt: num(l.goldenQAt, null),
    notes: typeof l.notes === "string" ? l.notes : "",
    parkedUntil: num(l.parkedUntil, null),
    archivedAt: num(l.archivedAt, null),
    createdAt: num(l.createdAt, num(l.firstDmAt, Date.now()))
  };
}
function num(v, d){ return (typeof v === "number" && isFinite(v)) ? v : d; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ flash("Could not save to localStorage: " + e.message, false); }
}

/* ---------------- helpers ---------------- */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function pad(n){ return n < 10 ? "0" + n : "" + n; }
function plural(n, word){ return n + " " + word + (n === 1 ? "" : "s"); }
function fmtLeft(ms){
  if (ms < 0) ms = 0;
  var d = Math.floor(ms / DAY);
  var h = Math.floor(ms % DAY / 3600000);
  var m = Math.floor(ms % 3600000 / 60000);
  var s = Math.floor(ms % 60000 / 1000);
  if (d > 0) return d + "d " + h + "h " + pad(m) + "m";
  if (h > 0) return h + "h " + pad(m) + "m";
  return pad(m) + "m " + pad(s) + "s";
}
function fmtDate(ts){
  if (!ts) return "—";
  var d = new Date(ts);
  return d.getDate() + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()] + " " + d.getFullYear();
}
function mondayStart(){
  var d = new Date();
  d.setHours(0,0,0,0);
  var dow = d.getDay();            // 0 Sun .. 6 Sat
  var back = (dow + 6) % 7;        // days since Monday
  return d.getTime() - back * DAY;
}
function byId(id){ return state.leads.filter(function(l){ return l.id === id; })[0]; }
function tabOf(l){
  if (l.status === "waiting") return "leads";
  if (l.status === "no_response") return "dead";
  return "respond";
}
function tabLabel(id){
  for (var i=0;i<TABS.length;i++) if (TABS[i].id === id) return TABS[i].label;
  return id;
}
function stateLabel(l){
  if (l.status === "waiting"){
    if (l.memeSentAt) return "no reply, final";
    if (l.followUp1SentAt) return "follow-up sent";
    return "waiting on reply";
  }
  if (l.status === "no_response") return "archived";
  if (l.status === "parked") return "parked, " + (l.stage || "Control Q");
  if (l.status === "client") return "client";
  return l.stage || "responded";
}

/* countdown model for a waiting lead */
function phaseOf(l){
  if (l.memeSentAt) return { kind:"final", target:null };
  if (l.followUp1SentAt) return { kind:"meme", target: l.firstDmAt + MEME_AFTER };
  return { kind:"followup", target: l.firstDmAt + FOLLOWUP_AFTER };
}
function cdText(l, now){
  var p = phaseOf(l);
  if (p.kind === "final") return { text:"No reply, final", due:false, final:true };
  var left = p.target - now;
  if (left <= 0) return { text: p.kind === "meme" ? "MEME DUE" : "FOLLOW UP DUE", due:true, final:false };
  return { text: (p.kind === "meme" ? "Meme in " : "Follow up in ") + fmtLeft(left), due:false, final:false };
}
function sortKey(l, now){
  var p = phaseOf(l);
  if (p.kind === "final") return Infinity;
  return p.target - now;
}

/* chase-up model for a lead in conversation (tab 2) */
function chaseAnchor(l){ return l.lastReplyAt || l.repliedAt || l.createdAt || Date.now(); }
function chaseText(l, now){
  var a = chaseAnchor(l);
  if (now < a + CHASE1_AFTER) return { text:"Chase in " + fmtLeft(a + CHASE1_AFTER - now), due:false, level:0 };
  if (now < a + CHASE2_AFTER) return { text:"CHASE · quiet 1d", due:true, level:1 };
  return { text:"CHASE · quiet 3d", due:true, level:2 };
}

/* ---------------- flash ---------------- */
var flashTimer = null;
function flash(msg, ok){
  var el = document.getElementById("flash");
  el.textContent = msg;
  el.className = "flash show" + (ok ? " ok" : "");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(function(){ el.className = "flash"; }, 4500);
}
function clearFlash(){
  clearTimeout(flashTimer);
  document.getElementById("flash").className = "flash";
}

/* ---------------- quick add ---------------- */
function addLead(raw){
  var h = String(raw || "").trim().replace(/^@+/,"").trim().toLowerCase();
  h = h.replace(/\s+/g,"");
  if (!h){ flash("Enter a handle first.", false); return false; }
  var dupe = state.leads.filter(function(l){ return l.handle === h; })[0];
  if (dupe){
    flash("@" + dupe.handle + " already exists in " + tabLabel(tabOf(dupe)) + " at " + stateLabel(dupe), false);
    return false;
  }
  var now = Date.now();
  state.leads.push({
    id: uid(), handle: h, firstDmAt: now, followUp1SentAt:null, memeSentAt:null,
    repliedAt:null, status:"waiting", stage:null, goldenQAt:null, notes:"",
    parkedUntil:null, archivedAt:null, createdAt: now
  });
  save();
  clearFlash();
  if (ui.tab === "script" || ui.tab === "dead") ui.tab = "leads";
  render();
  return true;
}

/* ---------------- actions ---------------- */
function act(id, what){
  var l = byId(id);
  if (!l) return;
  var now = Date.now();
  if (what === "followup"){ l.followUp1SentAt = now; }
  else if (what === "meme"){ l.memeSentAt = now; if (!l.followUp1SentAt) l.followUp1SentAt = now; }
  else if (what === "replied"){
    l.repliedAt = now; l.lastReplyAt = now; l.status = "responded"; l.stage = "Control Q";
    l.parkedUntil = null; l.archivedAt = null;
    ui.tab = "respond";
  }
  else if (what === "recontact"){ l.lastReplyAt = now; }
  else if (what === "archive" || what === "dead"){
    l.status = "no_response"; l.archivedAt = now; l.parkedUntil = null;
  }
  else if (what === "park"){
    l.status = "parked"; l.parkedUntil = now + PARK_FOR; ui.parkedOpen = true;
  }
  else if (what === "unpark"){
    l.status = "responded"; l.parkedUntil = null; l.lastReplyAt = now;
  }
  else if (what === "revive"){
    l.status = "responded"; l.stage = "Control Q"; l.archivedAt = null; l.parkedUntil = null;
    l.lastReplyAt = now;
    if (!l.repliedAt) l.repliedAt = now;
    ui.tab = "respond";
  }
  else if (what === "delete"){
    if (!confirm("Delete @" + l.handle + "? This cannot be undone.")) return;
    state.leads = state.leads.filter(function(x){ return x.id !== id; });
    delete ui.notesOpen[id];
  }
  save();
  render();
}
function setStage(id, stage){
  var l = byId(id);
  if (!l) return;
  var idx = STAGES.indexOf(stage);
  if (idx < 0) return;
  l.stage = stage;
  l.lastReplyAt = Date.now();   // stage moved = live activity, restart the chase clock
  if (idx >= GOLDEN_IDX && !l.goldenQAt) l.goldenQAt = Date.now();
  if (stage === "Client"){ l.status = "client"; l.parkedUntil = null; }
  else if (l.status === "client"){ l.status = "responded"; }
  save();
  render();
}

/* ---------------- stats ---------------- */
function renderStats(){
  var wk = mondayStart();
  var total = state.leads.length;
  var opens = state.leads.filter(function(l){ return l.createdAt >= wk; }).length;
  var golden = state.leads.filter(function(l){ return l.goldenQAt && l.goldenQAt >= wk; }).length;
  var calls = state.leads.filter(function(l){
    return l.stage && STAGES.indexOf(l.stage) >= CALL_IDX;
  }).length;
  var replied = state.leads.filter(function(l){ return l.repliedAt !== null; }).length;
  var rate = total ? Math.round(replied / total * 100) : 0;

  document.getElementById("stats").innerHTML =
    stat("Opens this week", opens + ' <em>/ ' + WEEKLY_TARGET + "</em>") +
    stat("Golden Qs this week", golden) +
    stat("Calls booked", calls) +
    stat("Reply rate", rate + "<em>%</em>");

  document.getElementById("totalHint").textContent =
    plural(total, "lead") + " stored locally in this browser";
}
function stat(k, v){
  return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + v + "</div></div>";
}

/* ---------------- nav ---------------- */
function counts(){
  var c = {leads:0, respond:0, dead:0};
  state.leads.forEach(function(l){ c[tabOf(l)]++; });
  return c;
}
function renderNav(){
  var c = counts();
  document.getElementById("nav").innerHTML = TABS.map(function(t){
    var n = t.id === "script" ? "" : '<span class="n">' + c[t.id] + "</span>";
    return '<button data-tab="' + t.id + '" class="' + (ui.tab === t.id ? "on" : "") + '">' +
      '<span class="full">' + esc(t.label) + '</span><span class="short">' + esc(t.short) + "</span>" + n + "</button>";
  }).join("");
}

/* ---------------- views ---------------- */
function render(){
  renderStats();
  renderNav();
  var v = document.getElementById("view");
  if (ui.tab === "leads") v.innerHTML = viewLeads();
  else if (ui.tab === "respond") v.innerHTML = viewRespond();
  else if (ui.tab === "dead") v.innerHTML = viewDead();
  else v.innerHTML = viewScript();
  hydrate();
  lastOverdueSig = overdueSig();
  tick();
}

function rowDelete(id){ return '<button class="x" data-act="delete" data-id="' + id + '" title="Delete">&times;</button>'; }

function viewLeads(){
  var now = Date.now();
  var list = state.leads.filter(function(l){ return l.status === "waiting"; })
    .sort(function(a,b){ return sortKey(a,now) - sortKey(b,now); });
  if (!list.length) return '<div class="empty">No open leads. Add a handle above the moment you send a first DM.</div>';

  return "<section>" + list.map(function(l){
    var c = cdText(l, now);
    var p = phaseOf(l);
    var acts = "";
    if (p.kind === "followup") acts += '<button class="mini primary" data-act="followup" data-id="' + l.id + '">Follow-up sent</button>';
    else if (p.kind === "meme") acts += '<button class="mini primary" data-act="meme" data-id="' + l.id + '">Meme sent</button>';
    else acts += '<button class="mini" data-act="archive" data-id="' + l.id + '">Archive</button>';
    acts += '<button class="mini" data-act="replied" data-id="' + l.id + '">Replied</button>';
    acts += rowDelete(l.id);

    return '<div class="row' + (c.due ? " due" : "") + '" data-row="' + l.id + '">' +
      '<div class="rowmain"><span class="handle">@' + esc(l.handle) + "</span>" +
      '<span class="cd' + (c.due ? " due" : "") + (c.final ? " final" : "") + '" data-cd="' + l.id + '">' + c.text + "</span></div>" +
      '<div class="acts">' + acts + "</div></div>";
  }).join("") + "</section>";
}

function viewRespond(){
  var active = state.leads.filter(function(l){ return l.status === "responded"; })
    .sort(function(a,b){ return chaseAnchor(a) - chaseAnchor(b); });   // stalest conversation first
  var parked = state.leads.filter(function(l){ return l.status === "parked"; })
    .sort(function(a,b){ return (a.parkedUntil || 0) - (b.parkedUntil || 0); });
  var clients = state.leads.filter(function(l){ return l.status === "client"; })
    .sort(function(a,b){ return (b.goldenQAt || b.createdAt) - (a.goldenQAt || a.createdAt); });

  var due = parked.filter(function(l){ return l.parkedUntil && l.parkedUntil <= Date.now(); }).length;
  if (due) ui.parkedOpen = true;

  var html = "";
  if (!active.length) html += '<div class="empty">Nobody in conversation right now.</div>';
  else html += "<section>" + active.map(convoRow).join("") + "</section>";

  if (parked.length){
    html += '<div class="sechead click' + (due ? " alert" : "") + '" data-toggle="parked">' +
      "<span>" + (ui.parkedOpen ? "▾" : "▸") + " Parked</span>" +
      '<span class="cnt">' + parked.length + (due ? " · " + due + " to resurface" : "") + "</span>" +
      '<span class="line"></span></div>';
    if (ui.parkedOpen) html += "<section>" + parked.map(parkedRow).join("") + "</section>";
  }

  if (clients.length){
    html += '<div class="sechead"><span>Clients</span><span class="cnt">' + clients.length + '</span><span class="line"></span></div>' +
      "<section>" + clients.map(convoRow).join("") + "</section>";
  }
  return html;
}

function convoRow(l){
  var idx = STAGES.indexOf(l.stage);
  var opts = STAGES.map(function(s){
    return '<option value="' + s + '"' + (s === l.stage ? " selected" : "") + ">" + s + "</option>";
  }).join("");
  var open = !!ui.notesOpen[l.id];
  var hasNotes = l.notes && l.notes.trim().length > 0;

  var html = '<div class="row" data-row="' + l.id + '">' +
    '<div class="rowmain"><span class="handle">@' + esc(l.handle) + "</span>";
  if (l.status === "responded"){
    var c = chaseText(l, Date.now());
    html += '<span class="cd' + (c.due ? " due" : "") + '" data-cd="' + l.id + '">' + c.text + "</span>";
  }
  if (l.goldenQAt) html += '<span class="meta">Golden Q ' + fmtDate(l.goldenQAt) + "</span>";
  html += "</div>" +
    '<div class="acts">' +
    '<select class="stage' + (idx >= GOLDEN_IDX ? " gold" : "") + '" data-stage="' + l.id + '">' + opts + "</select>" +
    '<button class="mini" data-toggle-notes="' + l.id + '">' + (open ? "Hide notes" : (hasNotes ? "Notes •" : "Notes")) + "</button>";
  if (l.status !== "client"){
    html += '<button class="mini" data-act="recontact" data-id="' + l.id + '" title="They replied / you messaged — restart the chase clock">Replied</button>' +
            '<button class="mini" data-act="park" data-id="' + l.id + '">Park</button>' +
            '<button class="mini danger" data-act="dead" data-id="' + l.id + '">Dead</button>';
  }
  html += rowDelete(l.id) + "</div>";
  if (open){
    html += '<div class="notes"><textarea data-notes="' + l.id + '" placeholder="their goal + pain in their exact words (for the mirror message)"></textarea></div>';
  }
  return html + "</div>";
}

function parkedRow(l){
  var now = Date.now();
  var overdue = l.parkedUntil && l.parkedUntil <= now;
  var txt = overdue ? "RESURFACE" : "Resurface in " + fmtLeft(l.parkedUntil - now);
  return '<div class="row' + (overdue ? " due" : "") + '" data-row="' + l.id + '">' +
    '<div class="rowmain"><span class="handle">@' + esc(l.handle) + "</span>" +
    '<span class="cd' + (overdue ? " due" : "") + '" data-cd="' + l.id + '">' + txt + "</span>" +
    '<span class="meta">' + esc(l.stage || "Control Q") + "</span></div>" +
    '<div class="acts">' +
      '<button class="mini primary" data-act="unpark" data-id="' + l.id + '">Unpark</button>' +
      '<button class="mini" data-toggle-notes="' + l.id + '">Notes</button>' +
      '<button class="mini danger" data-act="dead" data-id="' + l.id + '">Dead</button>' +
      rowDelete(l.id) +
    "</div>" +
    (ui.notesOpen[l.id] ? '<div class="notes"><textarea data-notes="' + l.id + '" placeholder="their goal + pain in their exact words (for the mirror message)"></textarea></div>' : "") +
    "</div>";
}

function viewDead(){
  var list = state.leads.filter(function(l){ return l.status === "no_response"; })
    .sort(function(a,b){ return (b.archivedAt || 0) - (a.archivedAt || 0); });
  if (!list.length) return '<div class="empty">Nothing archived yet.</div>';
  return "<section>" + list.map(function(l){
    return '<div class="row" data-row="' + l.id + '">' +
      '<div class="rowmain"><span class="handle">@' + esc(l.handle) + "</span>" +
      '<span class="meta">Archived ' + fmtDate(l.archivedAt) + "</span></div>" +
      '<div class="acts"><button class="mini" data-act="revive" data-id="' + l.id + '">Revive</button>' +
      rowDelete(l.id) + "</div></div>";
  }).join("") + "</section>";
}

/* ---------------- script ---------------- */
var SCRIPT = [
  { id:"s0", title:"STAGE 0: OPEN", sub:"send as 3 separate messages at the same time",
    items:[
      {t:"q", x:"[Name], thanks for the follow!"},
      {t:"q", x:"[profile relevant compliment]"},
      {t:"q", x:"whats up?"},
      {t:"n", x:'Alternate doors when there is no new follow: story reply, comment/like ("saw you liked the [x] reel, you training at the minute?"), old thread bump. Same checkpoints after.'},
      {t:"q", x:"saw you liked the [x] reel, you training at the minute?"}
    ]},
  { id:"s1", title:"STAGE 1: CONTROL Q", sub:"",
    items:[
      {t:"q", x:"you following for the vids or are you actually looking to get in shape?"},
      {t:"n", x:"If vids and standoffish: leave it, they are audience not a lead."}
    ]},
  { id:"s2", title:"STAGE 2: GOAL", sub:"one question only",
    items:[

      {t:"q", x:"what would that actually look like for you?"}
    ]},

    items:[

    ]},
  { id:"s4", title:"STAGE 4: MIRROR", sub:"mandatory before golden q",
    items:[

  { id:"s5", title:"STAGE 5: GOLDEN Q", sub:"",
    items:[

      {t:"q", x:"whats holding you back?"},

    items:[
      {t:"n", x:"Day 3 no reply: one casual bump. Day 7 no reply: meme follow-up. Then archive. Parked leads resurface at 21 days."}
    ]}
];

function viewScript(){
  var html = SCRIPT.map(function(s){
    var done = !!state.scriptChecks[s.id];
    var body = s.items.map(function(it){
      if (it.t === "n") return '<p class="note">' + esc(it.x) + "</p>";
      return '<div class="quote"><p>' + esc(it.x) + '</p>' +
        '<button class="mini" data-copy="' + esc(it.x) + '">Copy</button></div>';
    }).join("");
    return '<div class="stage' + (done ? " done" : "") + '">' +
      '<div class="top"><input type="checkbox" data-check="' + s.id + '"' + (done ? " checked" : "") + ">" +
      "<div><h3>" + esc(s.title) + "</h3>" + (s.sub ? '<div class="sub">(' + esc(s.sub) + ")</div>" : "") + "</div></div>" +
      body + "</div>";
  }).join("");
  return html + '<div style="padding:6px 0 0"><button class="mini" id="resetChecks">Reset checkpoints</button></div>';
}

/* ---------------- hydrate + events ---------------- */
function hydrate(){
  // fill textareas without going through innerHTML
  Array.prototype.forEach.call(document.querySelectorAll("[data-notes]"), function(ta){
    var l = byId(ta.getAttribute("data-notes"));
    if (l) ta.value = l.notes || "";
  });
}

document.addEventListener("click", function(e){
  var t = e.target;

  var copy = t.closest("[data-copy]");
  if (copy){ doCopy(copy.getAttribute("data-copy"), copy); return; }

  var a = t.closest("[data-act]");
  if (a){ act(a.getAttribute("data-id"), a.getAttribute("data-act")); return; }

  var n = t.closest("[data-toggle-notes]");
  if (n){
    var id = n.getAttribute("data-toggle-notes");
    ui.notesOpen[id] = !ui.notesOpen[id];
    render();
    var ta = document.querySelector('[data-notes="' + id + '"]');
    if (ta) ta.focus();
    return;
  }

  var sec = t.closest("[data-toggle]");
  if (sec){ ui.parkedOpen = !ui.parkedOpen; render(); return; }

  var tab = t.closest("[data-tab]");
  if (tab){ ui.tab = tab.getAttribute("data-tab"); clearFlash(); render(); return; }

  if (t.id === "resetChecks"){ state.scriptChecks = {}; save(); render(); return; }
});

document.addEventListener("change", function(e){
  var t = e.target;
  var st = t.getAttribute && t.getAttribute("data-stage");
  if (st){ setStage(st, t.value); return; }
  var ck = t.getAttribute && t.getAttribute("data-check");
  if (ck){ state.scriptChecks[ck] = t.checked; save(); render(); return; }
});

document.addEventListener("input", function(e){
  var id = e.target.getAttribute && e.target.getAttribute("data-notes");
  if (!id) return;
  var l = byId(id);
  if (!l) return;
  l.notes = e.target.value;
  save();
});

/* quick add */
var qa = document.getElementById("qa");
document.getElementById("qaBtn").addEventListener("click", function(){ submitAdd(); });
qa.addEventListener("keydown", function(e){
  if (e.key === "Enter"){ e.preventDefault(); submitAdd(); }
});
function submitAdd(){
  var ok = addLead(qa.value);
  if (ok) qa.value = "";
  qa.focus();
  qa.select();
}

/* copy */
function doCopy(text, btn){
  var done = function(){
    var old = btn.textContent;
    btn.textContent = "Copied";
    setTimeout(function(){ btn.textContent = old; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ legacyCopy(text, done); });
  } else legacyCopy(text, done);
}
function legacyCopy(text, done){
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch(e){ flash("Copy failed, select the text manually.", false); }
  document.body.removeChild(ta);
}

/* ---------------- export / import ---------------- */
document.getElementById("exportBtn").addEventListener("click", function(){
  var d = new Date();
  var name = "dm-tracker-backup-" + d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + ".json";
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  flash("Exported " + name, true);
});

document.getElementById("importBtn").addEventListener("click", function(){
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", function(e){
  var f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    var parsed;
    try { parsed = JSON.parse(r.result); }
    catch(err){ flash("That file is not valid JSON.", false); return; }
    if (!parsed || !Array.isArray(parsed.leads)){ flash("That file does not look like a tracker backup.", false); return; }
    if (!confirm("Import " + plural(parsed.leads.length, "lead") + "? This overwrites all current data (" + plural(state.leads.length, "lead") + ").")) return;
    state = {
      leads: parsed.leads.filter(function(l){ return l && typeof l.handle === "string"; }).map(normalise),
      scriptChecks: (parsed.scriptChecks && typeof parsed.scriptChecks === "object") ? parsed.scriptChecks : {}
    };
    ui.notesOpen = {};
    save();
    render();
    flash("Imported " + plural(state.leads.length, "lead") + ".", true);
  };
  r.readAsText(f);
});

/* ---------------- tick ---------------- */
function overdueSig(){
  var now = Date.now();
  return state.leads.map(function(l){
    if (l.status === "waiting"){
      var p = phaseOf(l);
      return p.kind === "final" ? "f" : (p.target <= now ? "1" : "0");
    }
    if (l.status === "parked") return (l.parkedUntil && l.parkedUntil <= now) ? "1" : "0";
    if (l.status === "responded") return "r" + chaseText(l, now).level;
    return "-";
  }).join("");
}

function tick(){
  var now = Date.now();
  var els = document.querySelectorAll("[data-cd]");
  for (var i=0;i<els.length;i++){
    var el = els[i];
    var l = byId(el.getAttribute("data-cd"));
    if (!l) continue;
    var text, due = false, final = false;
    if (l.status === "parked"){
      due = !!(l.parkedUntil && l.parkedUntil <= now);
      text = due ? "RESURFACE" : "Resurface in " + fmtLeft(l.parkedUntil - now);
    } else if (l.status === "responded"){
      var cc = chaseText(l, now);
      text = cc.text; due = cc.due;
    } else {
      var c = cdText(l, now);
      text = c.text; due = c.due; final = c.final;
    }
    if (el.textContent !== text) el.textContent = text;
    el.className = "cd" + (due ? " due" : "") + (final ? " final" : "");
    var row = el.closest("[data-row]");
    if (row) row.className = "row" + (due ? " due" : "");
  }
  // re-sort / re-group when something crosses zero, unless the user is typing
  var sig = overdueSig();
  if (sig !== lastOverdueSig){
    var ae = document.activeElement;
    var busy = ae && (ae.tagName === "TEXTAREA" || (ae.tagName === "INPUT" && ae.id === "qa" && ae.value));
    if (!busy){ render(); return; }
    // still typing — leave the signature alone so we retry on the next tick
  }
}

/* ---------------- boot ---------------- */
document.getElementById("today").textContent = fmtDate(Date.now());
render();
setInterval(tick, 1000);
qa.focus();
window.addEventListener("storage", function(e){
  if (e.key === KEY){ state = load(); render(); }
});
})();
</script>
